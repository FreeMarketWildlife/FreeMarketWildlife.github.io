<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field mouse proportions</title><style>body{margin:0;background:#eee9d5;color:#344238;font:16px system-ui}main{max-width:1120px;margin:auto;padding:24px}h1{margin:0 0 6px}p{margin:6px 0 16px}.poses{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;background:#faf6e6;border:1px solid #c4c8ab;border-radius:12px;padding:10px}canvas{width:100%;display:block}figcaption{font-weight:600}#scale{background:#e0e7ce;border-radius:12px;margin-top:16px}</style><main><h1>Field mouse · corrected proportions</h1><p>9 cm head/body + 9 cm thin tail · 3.5 cm height envelope · 25 g total; tail 0.05 g</p><div class="poses"></div><canvas id="scale" width="1120" height="230"></canvas><p>The lower comparison uses one shared scale: 1,200 pixels per metre. Tail mass is game tuning; body/tail lengths follow the wood-mouse reference.</p></main><script type="module">
