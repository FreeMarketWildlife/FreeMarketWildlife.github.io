<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/assets/images/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/fmw-clean-slab.ttf" as="font" type="font/ttf" crossorigin>

<script type="module" src="/assets/js/account.js?v=3"></script></head>
<body class="home">
  <a class="skip-link" href="#main">Skip to content</a>
  <main class="landing" id="main" tabindex="-1">
    <div class="landing-copy">
      <img class="landing-logo" src="/assets/images/mark.svg" width="96" height="96" alt="Free Market Wildlife emblem">
      <h1>Free Market<br>Wildlife</h1>
      <nav class="landing-nav" aria-label="Primary">
        <a href="/build-a-business/" data-home-destination><span class="menu-arrow" aria-hidden="true"></span><span data-home-destination-label>Build a Business</span></a>
        <a href="/game/"><span class="menu-arrow" aria-hidden="true"></span>Games</a>
        <a href="/blog/"><span class="menu-arrow" aria-hidden="true"></span>Blog</a>
      </nav>
    </div>
    <canvas class="nature-scene" data-nature-scene aria-hidden="true"></canvas>
  </main>
  <footer class="home-battlefield" aria-label="Castle siege animation">
  <div class="pixel-scene siege-scene" data-pixel-scene data-animation="siege">
    <canvas data-scene-layer="siege" role="img" aria-label="A castle siege with enemy dragon attacks and defending cavalry charges. Tap a soldier to defeat them."></canvas>
  </div>
  </footer>
  <footer class="home-privacy"><a href="/privacy/">Privacy</a></footer>
  <button class="home-access" type="button" data-open-access aria-label="Workspaces"><span>Workspaces</span></button>
  <dialog class="access-dialog" id="access-dialog" aria-labelledby="access-title">
  <div class="dialog-panel">
    <button class="close-button" type="button" data-close-access aria-label="Close client access">×</button>
    <span class="eyebrow">CLIENT WORKSPACE</span>
    <div class="lock-emblem"><img class="pixel-lock" src="/assets/images/lock.svg" width="24" height="28" alt=""></div>
    <h2 id="access-title">Workspaces</h2>
    <p class="muted">Choose a workspace to open.</p>
    <form data-access-form hidden>
      <label for="access-code">Password</label>
      <input id="access-code" name="passcode" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="access-error" placeholder="Enter password">
      <p class="form-error" id="access-error" aria-live="polite"></p>
      <button class="button primary" type="submit">Continue <span aria-hidden="true">→</span></button>
    </form><nav data-workspace-links aria-label="Workspaces"><ul><li><a href="/kat-kai/">Kat &amp; Kai</a></li><li><a href="/troykearns/">Troy Kearns</a></li><li><a href="/philip-aram/">Philip Aram</a></li></ul></nav>
    <p class="micro">Temporary preview access. Public content only.</p>
  </div>
