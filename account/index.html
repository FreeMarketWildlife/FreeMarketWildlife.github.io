<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Manage workspace access.">
  <title>Manage access — Free Market Wildlife</title>

  <link rel="stylesheet" href="/assets/css/styles.css">
  <script type="module" src="/assets/js/app.js?v=4-open"></script>
<script type="module" src="/assets/js/account.js?v=2"></script><link rel="stylesheet" href="/assets/css/tutorial-footer.css"></head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">

  <nav aria-label="Primary"><a href="/portfolio/">Portfolio</a><a href="/tanoshi/">Tanoshi</a><a href="/build-a-business/">Build a Business</a></nav>
  <button class="access-button" type="button" data-open-access aria-label="Workspaces"><span>Workspaces</span></button>
</header>
<main class="page-main" id="main" tabindex="-1">
<h1>Manage access</h1>
<p><a href="/account/business/">Business inquiries &amp; meeting settings →</a></p>
<section data-access-manager>
<form><label>Email address<input name="email" type="email" required maxlength="254" autocomplete="off"></label>
<label>Workspace<select name="workspace"><option value="philip-aram">Philip Aram</option><option value="troy-kearns">Troy Kearns</option><option value="kat-kai">Kat &amp; Kai</option></select></label>
<button type="submit">Grant access</button></form>
<p role="status"></p><ul data-memberships></ul>
</section></main>

<dialog class="access-dialog" id="access-dialog" aria-labelledby="access-title">
  <div class="dialog-panel">
    <button class="close-button" type="button" data-close-access aria-label="Close client access">×</button>
    <span class="eyebrow">CLIENT WORKSPACE</span>
    <div class="lock-emblem"><img class="pixel-lock" src="/assets/images/lock.svg" width="24" height="28" alt=""></div>
    <h2 id="access-title">Workspaces</h2>
    <p class="muted">Choose a workspace to open.</p>
    <form data-access-form hidden>
      <label for="access-code">Password</label>
      <input id="access-code" name="passcode" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="access-error" placeholder="Enter password">
      <p class="form-error" id="access-error" aria-live="polite"></p>
      <button class="button primary" type="submit">Continue <span aria-hidden="true">→</span></button>
    </form><nav data-workspace-links aria-label="Workspaces"><ul><li><a href="/kat-kai/">Kat &amp; Kai</a></li><li><a href="/troykearns/">Troy Kearns</a></li><li><a href="/philip-aram/">Philip Aram</a></li></ul></nav>
    <p class="micro">Temporary preview access. Public content only.</p>
  </div>
</dialog>
</body>
</html>
