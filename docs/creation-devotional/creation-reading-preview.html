const previewDeck={"title":"Devotional: Creation — complete reading presentation","speakingRoute":["slide-01-read-1","slide-02-read-1","slide-03-read-1","slide-03-read-2","slide-04-read-1","slide-05-read-1","slide-05-read-2","slide-07-read-1","slide-07-read-2","slide-08-read-1","slide-09-read-1","slide-10-read-1","slide-11-read-1","slide-11-read-2","slide-12-read-1","slide-13-read-1","slide-15-read-1","slide-15-read-2","slide-15-read-3","slide-15-read-4","slide-16-read-1","slide-17-read-1","slide-18-read-2","slide-19-read-1","slide-20-read-1","slide-37-read-1","slide-21-read-1","slide-21-read-2","slide-22-read-1","slide-22-read-3","slide-22-read-4","slide-23-read-1","slide-23-read-2","slide-24-read-1","slide-25-read-1","slide-25-read-2","slide-25-read-3","slide-25-read-4","slide-26-read-1","slide-27-read-1","slide-27-read-2"],"slides":[{"id":"slide-01-read-1","title":"Do you take God at His Word?","body":["Before we begin, I want to make my purpose absolutely clear. My purpose is to help you know God. We are aliens in a foreign land. And whether we realize it or not, we bring assumptions about God from the way we grew up and the culture around us. Every misconception His Word corrects is a blessing. Every correction helps us know Him better."],"status":"Application","readings":[],"visual":"none","appendix":false,"section":"Intro","sources":[],"layout":"reader","claimNote":"Personal purpose. This introduction states why I am speaking; it does not make my interpretation infallible."},{"id":"slide-02-read-1","title":"Why I place my understanding under Scripture","body":["Honestly, it shocks me how readily we can place animal suffering inside the original world God called very good. But I’m not saying that disagreeing with me about creation means you don’t belong to Christ.","I am asking us to examine what we believe, and why. The authority I’m speaking with today is not my own. I don’t want you to believe something just because I say it. I want us to let Scripture interpret Scripture."],"status":"Application","readings":[{"reference":"2 Timothy 3:16–17","url":"https://www.esv.org/2%20Timothy%203%3A16-17/","translation":"ESV","text":"All Scripture is breathed out by God and profitable for teaching, for reproof, for correction, and for training in righteousness, that the man of God may be complete, equipped for every good work.","relation":"Paul describes Scripture’s divine origin and its teaching, correcting and equipping purpose. “Let Scripture interpret Scripture” states my interpretive method, not the wording of this passage.","verseReferences":["2 Timothy 3:16","2 Timothy 3:17"]}],"visual":"none","appendix":false,"section":"Intro","sources":[],"layout":"reader","claimNote":"My view of animal death is a theological interpretation. Disagreement with it does not determine whether someone belongs to Christ."},{"id":"slide-03-read-1","title":"Context shapes a plain reading (1 of 2)","body":["Taking Jesus seriously does not mean looking for hinges when He calls Himself the door. In John 10 He uses a shepherd-and-sheep image to explain entry and salvation through Him. The surrounding speech tells us how to understand the image."],"status":"Interpretation","readings":[{"reference":"John 10:7–9","url":"https://www.esv.org/John%2010%3A7-9/","translation":"ESV","text":"So Jesus again said to them, “Truly, truly, I say to you, I am the door of the sheep. All who came before me are thieves and robbers, but the sheep did not listen to them. I am the door. If anyone enters by me, he will be saved and will go in and out and find pasture.","relation":"In this shepherd-and-sheep discourse, Jesus explains entry and salvation through Him. The metaphor is understood from that context.","verseReferences":["John 10:7","John 10:8","John 10:9"]}],"visual":"none","appendix":false,"section":"Intro","sources":[],"layout":"reader","claimNote":"Applying contextual reading to Genesis is a method. John 10 does not decide the genre or chronology of Genesis."},{"id":"slide-03-read-2","title":"Context shapes a plain reading (2 of 2)","body":["That is how I want to approach Genesis too: read the passage in its setting, notice its genre, and compare related passages. The presence of figurative language in one passage does not, by itself, decide the genre or chronology of another. My interpretation remains accountable to the text."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Intro","sources":[],"layout":"reader","claimNote":"Applying contextual reading to Genesis is a method. John 10 does not decide the genre or chronology of Genesis."},{"id":"slide-04-read-1","title":"Evolution is real.","body":["Evolution is a proven, observable, undeniable fact of God's creation. Now, before anybody panics, what do I mean? Heritable characteristics of populations change across generations. We observe variation, inheritance and natural selection. I believe the God who made creatures made them capable of adaptation.","I’m also part of the catholic church. Did you guys know that? What do we mean in the Apostles’ Creed by the holy catholic church? Universal. Where does your head go? Often to the Roman Catholic Church. Terminology matters. We need to know what claim we are actually talking about."],"status":"Illustration","readings":[],"visual":"none","appendix":false,"section":"Evolution Worldview","sources":[],"layout":"reader","claimNote":"Scientific terminology. Population change, common ancestry, life’s origin and atheism are different claims."},{"id":"slide-05-read-1","title":"Different words, different questions (1 of 2)","body":["When I spoke with Ben about evolution, he thought first about stars and planets. Someone else hears the same word and pictures human ancestry. Those are different subjects. Cosmic development concerns the history of the universe. Biological evolution concerns changes in living populations and the ancestry of organisms. Abiogenesis concerns the origin of the first life."],"status":"Illustration","readings":[],"visual":"none","appendix":false,"section":"Evolution Worldview","sources":[],"layout":"reader","claimNote":"Definitions explain the positions under discussion. A Christian may accept biological common ancestry while affirming a Creator."},{"id":"slide-05-read-2","title":"Different words, different questions (2 of 2)","body":["Philosophical naturalism makes a further claim about reality and the absence of a Creator. These subjects can connect in someone’s worldview, but they are not interchangeable. A Christian who accepts common ancestry has not therefore said that God does not exist. I disagree with that Christian’s reading of creation, but I must represent the position accurately."],"status":"Illustration","readings":[],"visual":"none","appendix":false,"section":"Evolution Worldview","sources":[],"layout":"reader","claimNote":"Definitions explain the positions under discussion. A Christian may accept biological common ancestry while affirming a Creator."},{"id":"slide-66-read-1","title":"More time — or an organizing mechanism? (1 of 2)","body":["Frank has a helpful illustration here. Picture red, white and blue confetti falling from a plane. Would giving it a longer fall explain an American flag laid out on your lawn? The point I appreciate is that more time alone is not an organizing mechanism. That is an illustration about explanation and design, not a probability calculation."],"status":"Illustration","visual":"confetti","appendix":false,"section":"Evolution Worldview","readings":[],"sources":["https://www.youtube.com/watch?v=TMmlAZLH0_4&t=1248s","https://crossexamined.org/is-old-earth-creation-anti-biblical-responding-to-ken-ham/"],"layout":"reader","claimNote":"Analogy: extra time alone is not an organizing mechanism. Scattered confetti is not a probability model of natural selection or proof about animal death."},{"id":"slide-66-read-2","title":"More time — or an organizing mechanism? (2 of 2)","body":["It is not a model of natural selection, where inheritance and differential reproduction matter. Turek uses it while discussing the origin of first life, a different question from biological evolution. And it does not establish when animals first died. My central argument still needs the biblical account: what does God call very good?"],"status":"Illustration","visual":"confetti","appendix":false,"section":"Evolution Worldview","readings":[],"sources":["https://www.youtube.com/watch?v=TMmlAZLH0_4&t=1248s","https://crossexamined.org/is-old-earth-creation-anti-biblical-responding-to-ken-ham/"],"layout":"reader","claimNote":"Analogy: extra time alone is not an organizing mechanism. Scattered confetti is not a probability model of natural selection or proof about animal death."},{"id":"slide-07-read-1","title":"The question underneath the debate (1 of 2)","body":["Frank Turek and I agree on a lot here. My central disagreement is not a number for the age of Earth. It is when animal death enters the story, and what God calls very good. I do not place animal death before the completed sixth day. God’s power is not the limitation. He did not need six days, six seconds, or billions of years."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Evolution Worldview","sources":[],"layout":"reader","claimNote":"This question concerns God’s completed “very good” creation on day six. The animal-death conclusion needs an argument; the phrase alone does not supply a biological timetable."},{"id":"slide-07-read-2","title":"The question underneath the debate (2 of 2)","body":["When I picture animal starvation and disease before God calls His completed creation very good, I want to ask whether that fits the account. Those two words need the food provision and wider biblical context; they are not a technical biology definition. We’re about to take a journey through the Bible. This is a devotional on God’s Word, so let’s focus on His Word."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Evolution Worldview","sources":[],"layout":"reader","claimNote":"This question concerns God’s completed “very good” creation on day six. The animal-death conclusion needs an argument; the phrase alone does not supply a biological timetable."},{"id":"slide-08-read-1","title":"The Creator is the Redeemer (1 of 2)","body":["Where would you start? At the beginning. When would you start taking God at His Word? Book one, chapter one, verse one. Genesis 1:1 opens by identifying God as Creator. Do you believe it? Okay, let’s move on. God is not one more thing inside the universe."],"status":"Interpretation","readings":[{"reference":"Genesis 1:1","url":"https://www.esv.org/Genesis%201%3A1/","translation":"ESV","text":"In the beginning, God created the heavens and the earth.","relation":"John explicitly attributes creation to the Word. Colossians explicitly describes redemption and forgiveness in the Son. Reading them together connects Creator and Redeemer.","verseReferences":["Genesis 1:1"]},{"reference":"John 1:3","url":"https://www.esv.org/John%201%3A3/","translation":"ESV","text":"All things were made through him, and without him was not any thing made that was made.","relation":"John explicitly attributes creation to the Word. Colossians explicitly describes redemption and forgiveness in the Son. Reading them together connects Creator and Redeemer.","verseReferences":["John 1:3"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"This is a Christian theological reading across passages; Genesis 1 alone does not spell out the later Trinitarian formulation."},{"id":"slide-08-read-2","title":"The Creator is the Redeemer (2 of 2)","body":["It belongs to Him. John says all things came through the Word; Colossians says through Christ and for Christ. Genesis describes the Spirit over the waters. The Creator is the Redeemer. This is not an unrelated preface before we get to Jesus."],"status":"Interpretation","readings":[{"reference":"Colossians 1:13–14","url":"https://www.esv.org/Colossians%201%3A13-14/","translation":"ESV","text":"He has delivered us from the domain of darkness and transferred us to the kingdom of his beloved Son, in whom we have redemption, the forgiveness of sins.","relation":"John explicitly attributes creation to the Word. Colossians explicitly describes redemption and forgiveness in the Son. Reading them together connects Creator and Redeemer.","verseReferences":["Colossians 1:13","Colossians 1:14"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"This is a Christian theological reading across passages; Genesis 1 alone does not spell out the later Trinitarian formulation."},{"id":"slide-09-read-1","title":"Six days. A completed, very good creation. (1 of 2)","body":["I read Genesis as six ordinary days. The numbered days, repeated evenings and mornings, and Exodus’s creation-workweek connection matter to my reading. But I want my central point clear: I am not trying to prove a numerical age for Earth today. I am asking what belongs in the completed creation God calls very good."],"status":"Interpretation","readings":[{"reference":"Exodus 20:11","url":"https://www.esv.org/Exodus%2020%3A11/","translation":"ESV","text":"For in six days the LORD made the heavens and the earth, the sea, and all that is in them, and rested on the seventh day. Therefore the LORD blessed the Sabbath day and made it holy.","relation":"The Sabbath command explicitly relates six days of creation and the seventh day of rest to Israel’s work pattern.","verseReferences":["Exodus 20:11"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"I understand the days as ordinary days. Their exact duration and a modern calendar date are interpretations, not a printed numerical age for Earth."},{"id":"slide-09-read-2","title":"Six days. A completed, very good creation. (2 of 2)","body":["I do not believe animal death belongs before that completed sixth day. Christians disagree about the days while confessing the same Creator. Frank Turek and I agree on much; this animal-death question is where I want us to examine the text carefully. The lexical and age debates are in the optional appendix."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"I understand the days as ordinary days. Their exact duration and a modern calendar date are interpretations, not a printed numerical age for Earth."},{"id":"slide-10-read-1","title":"One ordered creation week (1 of 2)","body":["Notice the correspondences between the first three days and the next three. Light and darkness correspond with the lights governing day and night. Waters and sky correspond with sea creatures and birds. Land and vegetation correspond with land animals and humanity. These pairings help us pay attention to the account’s order."],"status":"Interpretation","readings":[],"visual":"days","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The 1/4,2/5,3/6 correspondences are a thematic observation. They neither prove nor disprove sequence; full day readings appear in the detail slides."},{"id":"slide-10-read-2","title":"One ordered creation week (2 of 2)","body":["They do not, by themselves, prove or disprove a chronological reading. Also notice the details: the gathered seas are named on day three, and vegetation appears on day three. Day seven is a distinct culmination, not another pair. Let us walk through the days with room both for what the passage says and for questions it leaves us asking."],"status":"Interpretation","readings":[],"visual":"days","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The 1/4,2/5,3/6 correspondences are a thematic observation. They neither prove nor disprove sequence; full day readings appear in the detail slides."},{"id":"slide-11-read-1","title":"Vegetation on day three; food on day six (1 of 2)","body":["Genesis 1:9–13 places land and vegetation bearing seed and fruit on day three. The food assignment quoted here comes later, at the end of day six. Verse 29 addresses the people God has made.","I love the provision in that picture: plants, seed and fruit given for food. A fruit tree can feed someone and continue growing, bearing again in another season. I want to notice that provision without mixing up the days or the subjects of the verses."],"status":"Interpretation","readings":[{"reference":"Genesis 1:29","url":"https://www.esv.org/Genesis%201%3A29/","translation":"ESV","text":"And God said, “Behold, I have given you every plant yielding seed that is on the face of all the earth, and every tree with seed in its fruit. You shall have them for food.","relation":"Verse 29 assigns plant food to humanity on day six. The earlier appearance of vegetation is described in Genesis 1:9–13.","verseReferences":["Genesis 1:29"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"day":3,"layout":"reader","claimNote":"The quote concerns human food. Reading it alongside day-three vegetation is a contextual comparison, not a claim that the food speech occurs on day three."},{"id":"slide-11-read-2","title":"Food for the creatures described (2 of 2)","body":["The next verse addresses the beasts, birds and the other creatures described as having the breath of life. Animals can disperse some seeds after eating fruit, but that varies by species.","I am not saying every seed survives every animal or that no plant cells die. Plants are living organisms. My theological question concerns animal suffering and death in the world God calls very good, and that wider conclusion still needs an argument."],"status":"Interpretation","readings":[{"reference":"Genesis 1:30","url":"https://www.esv.org/Genesis%201%3A30/","translation":"ESV","text":"And to every beast of the earth and to every bird of the heavens and to everything that creeps on the earth, everything that has the breath of life, I have given every green plant for food.” And it was so.","relation":"Verse 30 is the food provision for the creatures it describes. The ecological illustration and the conclusion about mortality are further steps.","verseReferences":["Genesis 1:30"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"Food provision is explicit. The passage does not define every biological use of alive or give a complete animal-mortality timetable."},{"id":"slide-12-read-1","title":"Very good (1 of 2)","body":["Here is the assessment I keep returning to: very good. God looks at everything He has made and approves His completed creation. What belongs inside that declaration? I believe it is difficult to place animal starvation, disease, predation, and death before human rebellion and then call that the means by which God established His original good world."],"status":"Interpretation","readings":[{"reference":"Genesis 1:31","url":"https://www.esv.org/Genesis%201%3A31/","translation":"ESV","text":"And God saw everything that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.","relation":"God evaluates everything He has made and calls the completed creation very good. The verse also identifies the sixth day.","verseReferences":["Genesis 1:31"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The verse gives God’s assessment. My conclusion about animal suffering requires the surrounding account and wider biblical reasoning."},{"id":"slide-12-read-2","title":"Very good (2 of 2)","body":["But I do not want to pretend these two words settle every question by themselves. A tree being good does not mean the tree has kept the commandments. Goodness in a created thing and moral righteousness in a person are related but distinct questions. Let the food provisions and the wider biblical story help us examine the claim."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The verse gives God’s assessment. My conclusion about animal suffering requires the surrounding account and wider biblical reasoning."},{"id":"slide-13-read-1","title":"Finished work. A day of rest. (1 of 2)","body":["Do not let the chapter number stop you. Genesis 2:1–3 completes the creation account. God finishes His work, ceases from it and blesses the seventh day. The rest marks completion. Exodus draws on this pattern for Israel’s work and Sabbath.","I appreciate that God gives His people a rhythm. We are creatures who work and need rest. His completed creation gives us something to receive with gratitude rather than treating life as an endless attempt to prove everything depends on us."],"status":"Interpretation","readings":[{"reference":"Genesis 2:2–3","url":"https://www.esv.org/Genesis%202%3A2-3/","translation":"ESV","text":"And on the seventh day God finished his work that he had done, and he rested on the seventh day from all his work that he had done. So God blessed the seventh day and made it holy, because on it God rested from all his work that he had done in creation.","relation":"This account states completion, rest and blessing. Its wording gives the creation-work pattern rather than a medical description of tiredness.","verseReferences":["Genesis 2:2","Genesis 2:3"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"day":7,"layout":"reader","claimNote":"I apply the work-and-rest pattern devotionally. The text’s statement that God rests should be read together with its other descriptions of God."},{"id":"slide-13-read-2","title":"God’s rest does not mean exhausted power (2 of 2)","body":["This is not God recovering because He has run out of strength. Isaiah explicitly says He does not faint or grow weary. That separate passage helps explain why I understand the rest in Genesis as completion, not divine exhaustion.","Turn to Exodus 20:8–11 to see the work-and-rest connection with Israel. Then return to Genesis 2:4: the account draws close to the garden after the broad creation view."],"status":"Interpretation","readings":[{"reference":"Isaiah 40:28","url":"https://www.esv.org/Isaiah%2040%3A28/","translation":"ESV","text":"Have you not known? Have you not heard? The LORD is the everlasting God, the Creator of the ends of the earth. He does not faint or grow weary; his understanding is unsearchable.","relation":"Isaiah explicitly denies faintness and weariness of the Creator. Reading this alongside Genesis informs the interpretation of divine rest.","verseReferences":["Isaiah 40:28"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"This is a cross-text interpretation. Isaiah does not itself retell the seven-day account, and Genesis’s garden focus remains a narrative explanation."},{"id":"slide-14-read-1","title":"From the whole world to the garden","body":["Read the accounts together. Genesis 1 presents the broad account of creation. Genesis 2:4 introduces the following garden account, drawing close to the man, God’s command and marriage. I describe that change of focus as a close-up.","It is an explanation of the account’s movement, not a phrase the verse itself supplies. The change of focus does not settle every question about sequence, genre or translation. The passage deserves more careful reading than either a quick dismissal or a slogan."],"status":"Interpretation","readings":[{"reference":"Genesis 2:4","url":"https://www.esv.org/Genesis%202%3A4/","translation":"ESV","text":"These are the generations of the heavens and the earth when they were created, in the day that the LORD God made the earth and the heavens.","relation":"This verse introduces the generations of the heavens and earth and the following garden account.","verseReferences":["Genesis 2:4"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"Describing Genesis 2 as a close-up is an interpretive explanation of its focus, not a quotation from the verse."},{"id":"slide-15-read-1","title":"The command before disobedience (1 of 4)","body":["Genesis gives the man a command before the account of rebellion. He may eat from the garden’s trees, with a prohibition concerning the tree of the knowledge of good and evil and a warning about death.","Read this warning in its own place in the story. It establishes human accountability to the Creator. The issue is not that people lacked enough information to win a debate. They were responsible to hear and obey God."],"status":"Interpretation","readings":[{"reference":"Genesis 2:16–17","url":"https://www.esv.org/Genesis%202%3A16-17/","translation":"ESV","text":"And the LORD God commanded the man, saying, “You may surely eat of every tree of the garden, but of the tree of the knowledge of good and evil you shall not eat, for in the day that you eat of it you shall surely die.”","relation":"This is the command and warning before the transgression. It does not itself narrate the later ground curse or painful toil.","verseReferences":["Genesis 2:16","Genesis 2:17"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The command concerns the man’s obedience and the threatened consequence. It is distinct from the judgment pronounced after the transgression."},{"id":"slide-15-read-2","title":"Human rebellion in the narrative (2 of 4)","body":["Genesis 3 then describes taking and eating the prohibited fruit. The narrative presents disobedience, not merely an intellectual misunderstanding. I want us to hear that moral claim. It reaches beyond whether we are skilled at explaining creation.","We stand before the Creator as people accountable to Him. The following judgments belong to the account’s response to that transgression, so we should read the action and its consequences in sequence."],"status":"Interpretation","readings":[{"reference":"Genesis 3:6","url":"https://www.esv.org/Genesis%203%3A6/","translation":"ESV","text":"So when the woman saw that the tree was good for food, and that it was a delight to the eyes, and that the tree was to be desired to make one wise, she took of its fruit and ate, and she also gave some to her husband who was with her, and he ate.","relation":"This verse records the taking, eating and giving of the fruit. The command appears earlier, and the spoken judgments follow.","verseReferences":["Genesis 3:6"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The narrative describes a human act of disobedience. It does not answer every separate question about the first existence of all evil."},{"id":"slide-15-read-3","title":"Cursed ground and painful toil (3 of 4)","body":["The judgment concerning the man names his disobedience and the ground’s curse. Painful toil changes the way we understand the world we inhabit. Our present experience is not simply the original creation continuing untouched.","There is beauty and provision, but also pain and rupture. This is one of the narrative connections I bring into the larger theological argument. I must still distinguish what this judgment actually states from a complete chronology of every creature’s suffering."],"status":"Interpretation","readings":[{"reference":"Genesis 3:17","url":"https://www.esv.org/Genesis%203%3A17/","translation":"ESV","text":"And to Adam he said, “Because you have listened to the voice of your wife and have eaten of the tree of which I commanded you, ‘You shall not eat of it,’ cursed is the ground because of you; in pain you shall eat of it all the days of your life;","relation":"This judgment explicitly names the cursed ground and painful eating from it after disobedience. The earlier command alone did not state those details.","verseReferences":["Genesis 3:17"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The ground curse and painful toil are explicit here. Extending the narrative to every kind of animal mortality is a further theological inference."},{"id":"slide-15-read-4","title":"The return to dust (4 of 4)","body":["The man is told that he will return to the ground from which he was taken. That human return to dust matters to the Bible’s later discussion of Adam and Christ.","I want us to pay attention to the connection between human rebellion and our mortality without claiming that Genesis supplies every biological date we might ask for. The narrative’s judgment is serious, and it prepares us to hear why humanity needs redemption."],"status":"Interpretation","readings":[{"reference":"Genesis 3:19","url":"https://www.esv.org/Genesis%203%3A19/","translation":"ESV","text":"By the sweat of your face you shall eat bread, till you return to the ground, for out of it you were taken; for you are dust, and to dust you shall return.”","relation":"The verse directly addresses the man’s toil and return to dust. It is a statement about his mortality in this judgment.","verseReferences":["Genesis 3:19"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The explicit subject is human judgment and mortality. The wider animal-death argument must identify its additional interpretive steps."},{"id":"slide-16-read-1","title":"Adam and Christ (1 of 2)","body":["Romans 5 connects sin entering through one man with death spreading to humanity. Paul is explaining our relationship to Adam and our need for Christ. This passage matters enormously to the gospel. Adam’s disobedience and Christ’s obedience are not disconnected ideas. But notice the precision: Romans 5 directly discusses human sin and human death."],"status":"Interpretation","readings":[{"reference":"Romans 5:12","url":"https://www.esv.org/Romans%205%3A12/","translation":"ESV","text":"Therefore, just as sin came into the world through one man, and death through sin, and so death spread to all men because all sinned—","relation":"Paul connects Adam’s disobedience and death spreading to humanity with Christ’s obedience and the making righteous of many.","verseReferences":["Romans 5:12"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The explicit subject is human sin, death and righteousness. Applying the argument to animal mortality needs additional interpretive steps."},{"id":"slide-16-read-2","title":"Adam and Christ (2 of 2)","body":["It does not explicitly list every animal species. If I apply the wider argument to animal mortality, I need to explain the additional biblical connections. The strong point we must not lose is the one Paul does make: humanity needs the righteousness and life that come through Christ. We cannot repair Adam’s problem by congratulating ourselves on our own goodness."],"status":"Interpretation","readings":[{"reference":"Romans 5:19","url":"https://www.esv.org/Romans%205%3A19/","translation":"ESV","text":"For as by the one man’s disobedience the many were made sinners, so by the one man’s obedience the many will be made righteous.","relation":"Paul connects Adam’s disobedience and death spreading to humanity with Christ’s obedience and the making righteous of many.","verseReferences":["Romans 5:19"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The explicit subject is human sin, death and righteousness. Applying the argument to animal mortality needs additional interpretive steps."},{"id":"slide-17-read-1","title":"Creation groans and waits (1 of 2)","body":["Romans 8 widens our attention to creation itself. Paul describes futility, groaning, and the hope of liberation from corruption. He connects that hope with the revealing of God’s children and the redemption of our bodies. That gives us a way to look honestly at suffering without treating it as the last truth about the world."],"status":"Interpretation","readings":[{"reference":"Romans 8:20–21","url":"https://www.esv.org/Romans%208%3A20-21/","translation":"ESV","text":"For the creation was subjected to futility, not willingly, but because of him who subjected it, in hope that the creation itself will be set free from its bondage to corruption and obtain the freedom of the glory of the children of God.","relation":"Paul describes creation’s subjection to futility and promised freedom from corruption.","verseReferences":["Romans 8:20","Romans 8:21"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The passage gives creation’s groaning and hope; it does not print a species-by-species biological timetable."},{"id":"slide-17-read-2","title":"Creation groans and waits (2 of 2)","body":["The groaning is real. The hope is real too. This is one of the passages I bring into my larger argument about the Fall and creation’s brokenness. I do not want to isolate one verse and force it to answer everything. I want us to hear the movement from bondage toward the freedom God promises."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"The passage gives creation’s groaning and hope; it does not print a species-by-species biological timetable."},{"id":"slide-18-read-1","title":"My central question about animal death (1 of 2)","body":["What really matters in my argument is when death enters the world and what God calls very good. I do not place animal death before the completed sixth day. That is my reading of the original food provision, God’s assessment and the Bible’s movement through Fall and redemption. I also connect animal suffering with the fallen world in my broader theological argument."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"Theological inference: my no-animal-death-before-completed-day-six conclusion draws together food provision, “very good,” Fall and redemption. No single cited verse explicitly states the whole conclusion."},{"id":"slide-18-read-2","title":"My central question about animal death (2 of 2)","body":["But Genesis does not print a timetable for every species. Romans 5 directly addresses human sin and death, not a separate explicit statement that every animal was immortal. Romans 8 gives groaning and hope, not a detailed biology chronology. We need to identify that interpretive step honestly. A numerical age for the planet is not the test I am setting."],"status":"Interpretation","readings":[],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"Theological inference: my no-animal-death-before-completed-day-six conclusion draws together food provision, “very good,” Fall and redemption. No single cited verse explicitly states the whole conclusion."},{"id":"slide-19-read-1","title":"Judgment and mercy in Noah’s story (1 of 2)","body":["Read the biblical Flood narrative in its setting. Genesis 6–9 concerns human wickedness, judgment, divine preservation and covenant. Jesus uses Noah’s days in Matthew 24, and Peter refers to creation, Flood and judgment. These passages make the opening narrative significant within Christian teaching."],"status":"Interpretation","readings":[{"reference":"Genesis 6:5","url":"https://www.esv.org/Genesis%206%3A5/","translation":"ESV","text":"The LORD saw that the wickedness of man was great in the earth, and that every intention of the thoughts of his heart was only evil continually.","relation":"The narrative names human wickedness before judgment and God’s covenant promise afterward.","verseReferences":["Genesis 6:5"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"These passages establish the narrative’s judgment-and-mercy themes, not every proposed modern Flood mechanism or rock correlation."},{"id":"slide-19-read-2","title":"Judgment and mercy in Noah’s story (2 of 2)","body":["They do not by themselves verify every proposed modern flood mechanism, date or rock correlation. Genesis 10 describes nations. The Babel narrative begins in chapter 11, beyond this main survey. Detailed geology and long-lifespan questions are optional appendix material."],"status":"Interpretation","readings":[{"reference":"Genesis 9:11","url":"https://www.esv.org/Genesis%209%3A11/","translation":"ESV","text":"I establish my covenant with you, that never again shall all flesh be cut off by the waters of the flood, and never again shall there be a flood to destroy the earth.”","relation":"The narrative names human wickedness before judgment and God’s covenant promise afterward.","verseReferences":["Genesis 9:11"]}],"visual":"none","appendix":false,"section":"Biblical Worldview","sources":[],"layout":"reader","claimNote":"These passages establish the narrative’s judgment-and-mercy themes, not every proposed modern Flood mechanism or rock correlation."},{"id":"slide-20-read-1","title":"What does this say about God? (1 of 2)","body":["We have reached the heart of why this matters to me. What does our account of creation say about the God who made it? Scripture reveals His holiness, goodness, mercy, justice, wisdom, and love. I do not want to invent a version of goodness that simply mirrors my preferences. I want to ask how the Creator reveals Himself."],"status":"Interpretation","readings":[{"reference":"Exodus 34:6","url":"https://www.esv.org/Exodus%2034%3A6/","translation":"ESV","text":"The LORD passed before him and proclaimed, “The LORD, the LORD, a God merciful and gracious, slow to anger, and abounding in steadfast love and faithfulness,","relation":"In this self-description to Moses, God names mercy, grace, love and faithfulness while also affirming judgment.","verseReferences":["Exodus 34:6"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"This passage describes God’s character. It does not directly answer the disputed chronology of animal death."},{"id":"slide-20-read-2","title":"What does this say about God? (2 of 2)","body":["When I picture animal suffering before human rebellion, I struggle to reconcile that with the original completed good creation. That is my conviction. I am inviting you to examine the biblical argument, not simply to share my emotional reaction. God’s character is the reason the question deserves more than a quick dismissal."],"status":"Interpretation","readings":[{"reference":"Exodus 34:7","url":"https://www.esv.org/Exodus%2034%3A7/","translation":"ESV","text":"keeping steadfast love for thousands, forgiving iniquity and transgression and sin, but who will by no means clear the guilty, visiting the iniquity of the fathers on the children and the children’s children, to the third and the fourth generation.”","relation":"In this self-description to Moses, God names mercy, grace, love and faithfulness while also affirming judgment.","verseReferences":["Exodus 34:7"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"This passage describes God’s character. It does not directly answer the disputed chronology of animal death."},{"id":"slide-37-read-1","title":"Admiration and final authority","body":["I admire C. S. Lewis. That does not make every conclusion he reached my final authority. In The Problem of Pain he considers animal suffering before humanity, including speculative prehuman evil. He took the problem seriously; I still disagree with his approach.","Augustine also reminds us that different readings of creation days predate Darwin. Admiration does not settle interpretation. Not Lewis. Not Augustine. Not your pastor. And certainly not me. Bring the argument back to Scripture. Chronological snobbery cuts both ways: older does not automatically mean false, and newer does not automatically mean wiser."],"status":"Application","readings":[],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"Lewis and Augustine are historical examples, not authorities who settle Genesis. Their views are summarized, not presented as quotations from Scripture."},{"id":"slide-21-read-1","title":"Three questions about death (1 of 2)","body":["Am I saying every death in this fallen world is a moral evil? No. God’s judgment is righteous. Ezekiel calls the wicked to turn and live and says God takes no pleasure in their death.","We can affirm justice without celebrating death itself as our final good. Genesis 9 also permits animals for food. That is a different question from cruelty, and a different question from original creation."],"status":"Interpretation","readings":[{"reference":"Ezekiel 33:11","url":"https://www.esv.org/Ezekiel%2033%3A11/","translation":"ESV","text":"Say to them, As I live, declares the Lord GOD, I have no pleasure in the death of the wicked, but that the wicked turn from his way and live; turn back, turn back from your evil ways, for why will you die, O house of Israel?","relation":"Ezekiel explicitly calls the wicked to turn and live rather than depicting God as delighting in their death. Genesis explicitly permits animals for food.","verseReferences":["Ezekiel 33:11"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"Righteous judgment and permitted meat in the fallen world are distinct questions from my interpretation of original creation."},{"id":"slide-21-read-2","title":"Three questions about death (2 of 2)","body":["Here are the distinctions I want us to keep: what belonged to the world God originally called very good, what God justly judges after rebellion, and what He permits for food in the fallen world.","Keeping these separate strengthens the argument rather than weakening it. You can’t eat an In-N-Out burger without the death of a cow, but eating it is not therefore a sin. That is different from my question about original creation."],"status":"Interpretation","readings":[{"reference":"Genesis 9:3","url":"https://www.esv.org/Genesis%209%3A3/","translation":"ESV","text":"Every moving thing that lives shall be food for you. And as I gave you the green plants, I give you everything.","relation":"Ezekiel explicitly calls the wicked to turn and live rather than depicting God as delighting in their death. Genesis explicitly permits animals for food.","verseReferences":["Genesis 9:3"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"Righteous judgment and permitted meat in the fallen world are distinct questions from my interpretation of original creation."},{"id":"slide-22-read-1","title":"The question turns toward us (1 of 4)","body":["My main purpose is to help you understand what God means when He says good. Have you heard the story of the rich young ruler? Now I want this to get personal.","It is possible to defend six days passionately and still resist what God says about your own sin. The man in Mark wants eternal life and addresses Jesus as good teacher. Jesus turns his attention toward God’s unique goodness. The question reaches beyond winning an argument about the beginning."],"status":"Application","readings":[{"reference":"Mark 10:17–18","url":"https://www.esv.org/Mark%2010%3A17-18/","translation":"ESV","text":"And as he was setting out on his journey, a man ran up and knelt before him and asked him, “Good Teacher, what must I do to inherit eternal life?” And Jesus said to him, “Why do you call me good? No one is good except God alone.","relation":"This is the man’s question and Jesus’ reply in the encounter. It opens a discussion of God’s goodness and the man’s allegiance.","verseReferences":["Mark 10:17","Mark 10:18"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"Mark’s encounter raises the question of God’s unique goodness. My application is that a strong creation argument cannot substitute for responding to God about my own sin."},{"id":"slide-22-read-2","title":"A claim to goodness meets a costly call (2 of 4)","body":["Jesus names commandments concerning our life with other people. The man says he has kept them from his youth. Read that claim in the unfolding encounter, rather than treating his statement as Jesus’ declaration that the man has achieved sinless righteousness.","The next part of the story will expose what he is unwilling to surrender. This helps explain why I want our creation discussion to lead toward our own relationship with the Creator."],"status":"Application","readings":[{"reference":"Mark 10:19–20","url":"https://www.esv.org/Mark%2010%3A19-20/","translation":"ESV","text":"You know the commandments: ‘Do not murder, Do not commit adultery, Do not steal, Do not bear false witness, Do not defraud, Honor your father and mother.’” And he said to him, “Teacher, all these I have kept from my youth.”","relation":"The man makes this claim about his conduct. The narrative continues with Jesus’ call and the man’s response.","verseReferences":["Mark 10:19","Mark 10:20"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"The man’s claim to have kept the commandments is his statement in the story. The following response to Jesus’ call exposes his allegiance."},{"id":"slide-22-read-3","title":"Will he follow Jesus? (3 of 4)","body":["Jesus looks at him and loves him, then calls him to a costly act of trust and to follow. The man leaves sorrowful because he has great possessions. The issue reaches his allegiance. What does he prize more than following Christ?","I want that question to reach me too. God’s goodness is not a way to congratulate myself. It exposes the depth of my need and asks what I am unwilling to place under His authority."],"status":"Application","readings":[{"reference":"Mark 10:21–22","url":"https://www.esv.org/Mark%2010%3A21-22/","translation":"ESV","text":"And Jesus, looking at him, loved him, and said to him, “You lack one thing: go, sell all that you have and give to the poor, and you will have treasure in heaven; and come, follow me.” Disheartened by the saying, he went away sorrowful, for he had great possessions.","relation":"The man’s sorrow and possessions belong to Mark’s actual account. Applying that encounter to my own allegiance is an application.","verseReferences":["Mark 10:21","Mark 10:22"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"The cost of following and the man’s sorrow are in Mark’s account. The question about my own allegiance is an application."},{"id":"slide-22-read-4","title":"God knows the public and private self (4 of 4)","body":["You know your failures, and God knows your failures. He knows the public version and the private version. He knows selfishness beneath an impressive act and bitterness I keep explaining away. Psalm 139 describes the speaker as already searched and known by God.","I cannot argue my way out of that knowledge. Neither can you. Romans 3:23 says all have sinned and fall short of God’s glory. We need more than a better public image."],"status":"Application","readings":[{"reference":"Psalm 139:1–4","url":"https://www.esv.org/Psalm%20139%3A1-4/","translation":"ESV","text":"O LORD, you have searched me and known me! You know when I sit down and when I rise up; you discern my thoughts from afar. You search out my path and my lying down and are acquainted with all my ways. Even before a word is on my tongue, behold, O LORD, you know it altogether.","relation":"These opening verses support the claim that God knows the speaker’s actions, thoughts and words. Verses 23–24, used later, are the prayer for searching.","verseReferences":["Psalm 139:1","Psalm 139:2","Psalm 139:3","Psalm 139:4"]}],"visual":"none","appendix":false,"section":"Why does this matter?","sources":[],"layout":"reader","claimNote":"Psalm 139:1–4 directly addresses God’s knowledge. Its opening differs from the searching prayer in verses 23–24, quoted later."},{"id":"slide-23-read-1","title":"Christ died for our sins (1 of 2)","body":["This is more important than the creationist thing. More important than the six days. It is not about winning a science argument. It is about the gospel. Jesus lived the righteous life we have not lived. Mark 10:45 describes His giving His life as a ransom for many."],"status":"Scripture","readings":[{"reference":"1 Peter 3:18","url":"https://www.esv.org/1%20Peter%203%3A18/","translation":"ESV","text":"For Christ also suffered once for sins, the righteous for the unrighteous, that he might bring us to God, being put to death in the flesh but made alive in the spirit,","relation":"These texts directly describe Christ’s righteous suffering for the unrighteous and His sinlessness in relation to our righteousness in Him.","verseReferences":["1 Peter 3:18"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"This Gospel claim concerns reconciliation to God. Agreement with my creation interpretation is not its condition."},{"id":"slide-23-read-2","title":"Christ died for our sins (2 of 2)","body":["First Peter 3:18 describes Christ suffering for sins, the righteous for the unrighteous, to bring us to God. Second Corinthians 5:21 brings His sinlessness and our righteousness in Him together. This is the destination of the devotional. Our need is deeper than an improved argument about origins: we need reconciliation with the God against whom we have sinned."],"status":"Scripture","readings":[{"reference":"2 Corinthians 5:21","url":"https://www.esv.org/2%20Corinthians%205%3A21/","translation":"ESV","text":"For our sake he made him to be sin who knew no sin, so that in him we might become the righteousness of God.","relation":"These texts directly describe Christ’s righteous suffering for the unrighteous and His sinlessness in relation to our righteousness in Him.","verseReferences":["2 Corinthians 5:21"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"This Gospel claim concerns reconciliation to God. Agreement with my creation interpretation is not its condition."},{"id":"slide-24-read-1","title":"Christ died and rose (1 of 2)","body":["Paul’s Gospel includes Christ’s death for sins, burial and resurrection. He is reminding the Corinthians of the message he received and delivered to them. The resurrection is essential to that message. It is not a decorative ending to a creation talk.","Jesus’ death concerns our sins, and the risen Christ is the foundation of our hope. I want this discussion to lead toward worship of Him, rather than stop with an argument about the past."],"status":"Scripture","readings":[{"reference":"1 Corinthians 15:3–4","url":"https://www.esv.org/1%20Corinthians%2015%3A3-4/","translation":"ESV","text":"For I delivered to you as of first importance what I also received: that Christ died for our sins in accordance with the Scriptures, that he was buried, that he was raised on the third day in accordance with the Scriptures,","relation":"Paul explicitly names death for sins, burial and resurrection as content of the message he passed on.","verseReferences":["1 Corinthians 15:3","1 Corinthians 15:4"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"The Gospel’s resurrection claim is explicit here. Agreement with my creation chronology is not included as its condition."},{"id":"slide-24-read-2","title":"Without the resurrection, we remain in sin (2 of 2)","body":["Paul presses the consequences of denying resurrection. If Christ has not been raised, faith is futile and we remain in our sins. That is why His resurrection cannot be an optional detail of Christian hope.","Paul also identifies death as the enemy to be destroyed in Christ’s victory. Agreement with Phil’s reading cannot save anyone. The risen Christ can. This is the salvation foundation I want to keep distinct from a disputed creation chronology."],"status":"Scripture","readings":[{"reference":"1 Corinthians 15:17","url":"https://www.esv.org/1%20Corinthians%2015%3A17/","translation":"ESV","text":"And if Christ has not been raised, your faith is futile and you are still in your sins.","relation":"Verse 17 states the consequence for faith and sin. Verse 26 names death as the last enemy to be destroyed.","verseReferences":["1 Corinthians 15:17"]},{"reference":"1 Corinthians 15:26","url":"https://www.esv.org/1%20Corinthians%2015%3A26/","translation":"ESV","text":"The last enemy to be destroyed is death.","relation":"Verse 17 states the consequence for faith and sin. Verse 26 names death as the last enemy to be destroyed.","verseReferences":["1 Corinthians 15:26"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"The necessity of resurrection and defeat of death are explicit. Applying them to every detail of pre-Fall animal biology is a further theological argument."},{"id":"slide-25-read-1","title":"A gift, not a wage we earn (1 of 4)","body":["Salvation is not your reward for understanding every chapter of Genesis. It is God’s gift of grace received through faith in Christ. Sin’s wages and God’s gift are different.","I cannot purchase eternal life by church attendance, a good reputation or winning a debate. Christ is the ground of my hope. That is why the conclusion of this devotional matters more than whether you agree with my creation chronology."],"status":"Scripture","readings":[{"reference":"Romans 6:23","url":"https://www.esv.org/Romans%206%3A23/","translation":"ESV","text":"For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord.","relation":"Romans contrasts wages and gift. Ephesians explicitly identifies salvation by grace through faith, rather than a ground for boasting in works.","verseReferences":["Romans 6:23"]},{"reference":"Ephesians 2:8–9","url":"https://www.esv.org/Ephesians%202%3A8-9/","translation":"ESV","text":"For by grace you have been saved through faith. And this is not your own doing; it is the gift of God, not a result of works, so that no one may boast.","relation":"Romans contrasts wages and gift. Ephesians explicitly identifies salvation by grace through faith, rather than a ground for boasting in works.","verseReferences":["Ephesians 2:8","Ephesians 2:9"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"These verses explicitly describe God’s gift and salvation by grace through faith. They do not make agreement with a creation chronology a condition."},{"id":"slide-25-read-2","title":"Repent and trust Christ (2 of 4)","body":["If you have never turned to Him, repent and trust Him. Do not rest your hope in your own goodness or your ability to defend a position. Rest it in Christ, crucified and risen. Repentance is not merely saying that somebody else is wrong.","It concerns turning from our sin toward God. Faith is not a polished religious performance; its object is Christ and His Gospel. A familiar invitation phrase must not replace what Jesus actually calls for."],"status":"Scripture","readings":[{"reference":"Mark 1:15","url":"https://www.esv.org/Mark%201%3A15/","translation":"ESV","text":"and saying, “The time is fulfilled, and the kingdom of God is at hand; repent and believe in the gospel.”","relation":"Jesus explicitly calls for repentance and belief in the Gospel. This supports the devotional’s invitation, rather than a test about creation age.","verseReferences":["Mark 1:15"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"Jesus calls for repentance and belief in the Gospel. This invitation concerns turning toward Him, rather than merely winning an argument."},{"id":"slide-25-read-3","title":"Accepted in Christ, still confessing sin (3 of 4)","body":["If you belong to Him, your acceptance rests in Christ. God does not become unaware of His children’s sins. We still confess them and seek His cleansing. My earlier rough wording that He does not see our wickedness needed that correction.","No condemnation does not mean that we are already flawless or that sin has become invisible to God. Justification and our continuing growth in holiness must be distinguished."],"status":"Scripture","readings":[{"reference":"Romans 8:1","url":"https://www.esv.org/Romans%208%3A1/","translation":"ESV","text":"There is therefore now no condemnation for those who are in Christ Jesus.","relation":"These passages directly state no condemnation in Christ and the need to acknowledge and confess sin. Both claims belong together.","verseReferences":["Romans 8:1"]},{"reference":"1 John 1:8–9","url":"https://www.esv.org/1%20John%201%3A8-9/","translation":"ESV","text":"If we say we have no sin, we deceive ourselves, and the truth is not in us. If we confess our sins, he is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.","relation":"These passages directly state no condemnation in Christ and the need to acknowledge and confess sin. Both claims belong together.","verseReferences":["1 John 1:8","1 John 1:9"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"No condemnation in Christ does not make sin invisible to God. The continuing confession in 1 John supplies the necessary qualification."},{"id":"slide-25-read-4","title":"Good works grow from grace (4 of 4)","body":["Good works do not become the price we pay to purchase salvation. They grow from God’s grace. Ephesians places the exclusion of boasting beside the purpose of walking in good works.","So I must not use the rich man’s story to deny that a believer can do anything rightly called good. God’s sinless righteousness, a created thing’s goodness, and ordinary or Spirit-produced human good are related uses that require attention to context."],"status":"Scripture","readings":[{"reference":"Ephesians 2:10","url":"https://www.esv.org/Ephesians%202%3A10/","translation":"ESV","text":"For we are his workmanship, created in Christ Jesus for good works, which God prepared beforehand, that we should walk in them.","relation":"The verse explicitly describes creation in Christ for good works. It corrects an overly broad claim that Scripture never calls a believer’s work good.","verseReferences":["Ephesians 2:10"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"Ephesians describes good works as part of life in Christ. “Good” must be read in context rather than reduced to one definition everywhere."},{"id":"slide-26-read-1","title":"The curse will not remain (1 of 2)","body":["Our hope reaches beyond forgiveness alone. Christ will raise His people. God will dwell with them. Death, mourning, and the curse will not rule forever. The promised future is not merely that we stop asking questions about the past. It is life with our Creator in a world no longer broken by sin."],"status":"Scripture","readings":[{"reference":"Revelation 21:4","url":"https://www.esv.org/Revelation%2021%3A4/","translation":"ESV","text":"He will wipe away every tear from their eyes, and death shall be no more, neither shall there be mourning, nor crying, nor pain anymore, for the former things have passed away.”","relation":"The promised new creation removes death and mourning, and the curse will be gone.","verseReferences":["Revelation 21:4"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"Future restoration is explicit. It is not a detailed specification of every aspect of Eden’s biology or the intermediate state."},{"id":"slide-26-read-2","title":"The curse will not remain (2 of 2)","body":["That hope changes how we face suffering now. We can grieve without pretending death is harmless, and we can trust without pretending we understand every detail. The One through whom all things were made is faithful to complete His saving work. This is the hope I want us to carry from the beginning of Scripture toward its promised end."],"status":"Scripture","readings":[{"reference":"Revelation 22:3","url":"https://www.esv.org/Revelation%2022%3A3/","translation":"ESV","text":"No longer will there be anything accursed, but the throne of God and of the Lamb will be in it, and his servants will worship him.","relation":"The promised new creation removes death and mourning, and the curse will be gone.","verseReferences":["Revelation 22:3"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"Future restoration is explicit. It is not a detailed specification of every aspect of Eden’s biology or the intermediate state."},{"id":"slide-27-read-1","title":"Submit yourself to God’s Word (1 of 2)","body":["Here is the response I am asking for. Submit yourself to God’s Word. Bring Him the belief you have never questioned. Bring Him the command you keep avoiding. Bring Him the part of your life where you want forgiveness but resist His authority. Do not take my word for everything we have discussed. Open Genesis."],"status":"Application","readings":[{"reference":"Psalm 139:23–24","url":"https://www.esv.org/Psalm%20139%3A23-24/","translation":"ESV","text":"Search me, O God, and know my heart! Try me and know my thoughts! And see if there be any grievous way in me, and lead me in the way everlasting!","relation":"This is a prayer asking God to search the speaker, expose grievous ways and lead him rightly.","verseReferences":["Psalm 139:23","Psalm 139:24"]}],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"I apply that prayer to my own convictions and obedience; it is not a demand that everyone accept my chronology."},{"id":"slide-27-read-2","title":"Submit yourself to God’s Word (2 of 2)","body":["Read the passages around the verses. Bring your questions. If I have handled a passage wrongly, show me. I need to submit to His Word too. Let us pray that God gives us humility, corrects our errors, deepens our trust in Christ, and makes us willing to obey. The question is whether we will hear Him and respond."],"status":"Application","readings":[],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"I apply that prayer to my own convictions and obedience; it is not a demand that everyone accept my chronology."},{"id":"slide-28-read-1","title":"Let’s open the text together","body":["I would like to hear your questions. We do not need to pretend we have resolved every issue. Which passage would you like to examine more closely? Where did an interpretive step need more explanation? What do you understand very good to mean in its context? How do you connect Genesis 3, Romans 8, and the promised removal of the curse?","We can also ask a more personal question: where do we rely on our own goodness instead of God’s grace? Please feel free to disagree and show us the text behind your answer. I want a conversation that helps us know God and understand His Word more faithfully."],"status":"Open question","readings":[],"visual":"none","appendix":false,"section":"Conclusion","sources":[],"layout":"reader","claimNote":"Discussion questions invite textual examination. They are questions and applications, not additional claims of direct biblical teaching."},{"id":"slide-29-read-1","title":"Day 1: light and darkness (1 of 2)","body":["One thing that stops me here is the separation of light and darkness before the day-four account of the lights. I do not fully understand that. I want to be able to say so without treating my uncertainty as a defect in Scripture. The passage tells us what God does; it does not answer every physical question we can ask."],"status":"Interpretation","readings":[{"reference":"Genesis 1:3–5","url":"https://www.esv.org/Genesis%201%3A3-5/","translation":"ESV","text":"And God said, “Let there be light,” and there was light. And God saw that the light was good. And God separated the light from the darkness. God called the light Day, and the darkness he called Night. And there was evening and there was morning, the first day.","relation":"The account names light, separation of light and darkness, evening and morning, and the first day.","verseReferences":["Genesis 1:3","Genesis 1:4","Genesis 1:5"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"day":1,"layout":"reader","claimNote":"The text reports these acts without describing a complete physical mechanism or identifying the light source here."},{"id":"slide-29-read-2","title":"Day 1: light and darkness (2 of 2)","body":["The account also sounds to me as though it describes creation with attention to the earth, but that is an observation about the description, not proof of a technical viewpoint. Let us distinguish what is written from the model we build in our minds to picture it."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The text reports these acts without describing a complete physical mechanism or identifying the light source here."},{"id":"slide-30-read-1","title":"Day 2: waters and expanse (1 of 2)","body":["When I first read this, I pictured a water canopy or perhaps clouds. Then I kept reading about the lights in the expanse and the birds flying across it, and I began reconsidering what I was picturing. Is sky the best English description here? Are we thinking too narrowly if we insist on one modern physical category?"],"status":"Interpretation","readings":[{"reference":"Genesis 1:6–7","url":"https://www.esv.org/Genesis%201%3A6-7/","translation":"ESV","text":"And God said, “Let there be an expanse in the midst of the waters, and let it separate the waters from the waters.” And God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse. And it was so.","relation":"This is the text’s distinction between the waters and the expanse. Later lights and birds are described in Genesis 1:14–20.","verseReferences":["Genesis 1:6","Genesis 1:7"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"day":2,"layout":"reader","claimNote":"Canopy, cloud, sky and outer-space models go beyond what these verses specify. Psalm 148:4 is another waters-above reference, not a technical mechanism."},{"id":"slide-30-read-2","title":"Day 2: waters and expanse (2 of 2)","body":["I want Scripture to interpret Scripture. We can compare the Flood account and Psalm 148. But the comparison does not authorize us to claim that Genesis explicitly describes a vapor canopy that later collapsed. That would be a hypothesis. The useful starting point is the distinction the passage actually makes between the waters and the expanse."],"status":"Interpretation","readings":[{"reference":"Genesis 1:8","url":"https://www.esv.org/Genesis%201%3A8/","translation":"ESV","text":"And God called the expanse Heaven. And there was evening and there was morning, the second day.","relation":"This is the text’s distinction between the waters and the expanse. Later lights and birds are described in Genesis 1:14–20.","verseReferences":["Genesis 1:8"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Canopy, cloud, sky and outer-space models go beyond what these verses specify. Psalm 148:4 is another waters-above reference, not a technical mechanism."},{"id":"slide-31-read-1","title":"Day 4: lights and appointed times (1 of 2)","body":["If you have the opportunity to stand under a truly dark sky, do it. Pictures do not replace that experience for me. Look through a telescope if you can. The heavens draw my attention to the glory of their Maker. Genesis describes lights marking times and illuminating the earth."],"status":"Interpretation","readings":[{"reference":"Genesis 1:14–15","url":"https://www.esv.org/Genesis%201%3A14-15/","translation":"ESV","text":"And God said, “Let there be lights in the expanse of the heavens to separate the day from the night. And let them be for signs and for seasons, and for days and years, and let them be lights in the expanse of the heavens to give light upon the earth.” And it was so.","relation":"The account describes the lights’ functions and the greater and lesser lights.","verseReferences":["Genesis 1:14","Genesis 1:15"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"day":4,"layout":"reader","claimNote":"Reflected moonlight is an astronomical fact used for a devotional analogy. English Sun/Son wordplay does not establish Hebrew meaning."},{"id":"slide-31-read-2","title":"Day 4: lights and appointed times (2 of 2)","body":["The Moon reflects sunlight, and that gives me a devotional illustration: we ought to reflect the light we receive rather than behave as though it originates in us. That is an application, not a hidden Hebrew argument. The English similarity between sun and son does not establish the meaning of Genesis. The wonder is already there without making the illustration prove more than it can."],"status":"Interpretation","readings":[{"reference":"Genesis 1:16","url":"https://www.esv.org/Genesis%201%3A16/","translation":"ESV","text":"And God made the two great lights—the greater light to rule the day and the lesser light to rule the night—and the stars.","relation":"The account describes the lights’ functions and the greater and lesser lights.","verseReferences":["Genesis 1:16"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Reflected moonlight is an astronomical fact used for a devotional analogy. English Sun/Son wordplay does not establish Hebrew meaning."},{"id":"slide-32-read-1","title":"Day 5: life fills the waters and sky (1 of 2)","body":["The waters teem with living creatures and birds fly above the earth. Notice the blessing. God addresses His creatures with fruitfulness and multiplication. He cares about the life He has made. This develops the connection with the waters and sky described earlier. I also notice the repeated references to kinds and goodness."],"status":"Interpretation","readings":[{"reference":"Genesis 1:21–22","url":"https://www.esv.org/Genesis%201%3A21-22/","translation":"ESV","text":"So God created the great sea creatures and every living creature that moves, with which the waters swarm, according to their kinds, and every winged bird according to its kind. And God saw that it was good. And God blessed them, saying, “Be fruitful and multiply and fill the waters in the seas, and let birds multiply on the earth.”","relation":"These verses state the creation of sea creatures and birds and God’s blessing of fruitfulness.","verseReferences":["Genesis 1:21","Genesis 1:22"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"day":5,"layout":"reader","claimNote":"The term “kinds” is not assigned a modern species/family taxonomic equivalence by the passage."},{"id":"slide-32-read-2","title":"Day 5: life fills the waters and sky (2 of 2)","body":["But I do not want to assume that the word kinds automatically corresponds to a particular modern scientific rank, such as species or family. We should read the word carefully rather than use it as a shortcut. The movement I want us to see is God creating, blessing, and providing a world that fills with life."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The term “kinds” is not assigned a modern species/family taxonomic equivalence by the passage."},{"id":"slide-33-read-1","title":"Day 6: animals and humanity (1 of 2)","body":["Genesis describes land animals and humanity made in God’s image. Our worth and accountability are grounded in our relationship to our Maker. I read these as belonging to the same creation day."],"status":"Interpretation","readings":[{"reference":"Genesis 1:26","url":"https://www.esv.org/Genesis%201%3A26/","translation":"ESV","text":"Then God said, “Let us make man in our image, after our likeness. And let them have dominion over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”","relation":"Humanity is made in God’s image in this creation account.","verseReferences":["Genesis 1:26"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"day":6,"layout":"reader","claimNote":"The account does not name a modern dinosaur species or establish a fossil chronology by itself."},{"id":"slide-33-read-2","title":"Day 6: animals and humanity (2 of 2)","body":["The text does not identify a modern dinosaur species or by itself establish a fossil chronology. Our task here is to hear what it does say: God creates, blesses, gives responsibility and provides."],"status":"Interpretation","readings":[{"reference":"Genesis 1:27","url":"https://www.esv.org/Genesis%201%3A27/","translation":"ESV","text":"So God created man in his own image, in the image of God he created him; male and female he created them.","relation":"Humanity is made in God’s image in this creation account.","verseReferences":["Genesis 1:27"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The account does not name a modern dinosaur species or establish a fossil chronology by itself."},{"id":"slide-34-read-1","title":"Dinosaurs: what are we claiming? (1 of 2)","body":["Dinosaurs are exciting. Their size and variety make us stop and look. I want that wonder in this presentation, but I also want us to know exactly what we are claiming. Genesis does not use the modern word dinosaur. Identifying Job’s Behemoth or Leviathan with a particular extinct species is debated."],"status":"Open question","readings":[{"reference":"Job 40:15","url":"https://www.esv.org/Job%2040%3A15/","translation":"ESV","text":"“Behold, Behemoth, which I made as I made you; he eats grass like an ox.","relation":"Job names Behemoth and describes it; it does not provide a modern scientific species name.","verseReferences":["Job 40:15"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Identifying Behemoth or Leviathan with a particular dinosaur remains uncertain. An imagined picture cannot establish coexistence."},{"id":"slide-34-read-2","title":"Dinosaurs: what are we claiming? (2 of 2)","body":["An artist can show a human beside a giant animal, but the artwork is not the evidence. If we are going to discuss fossils, chronology, or Job’s creatures in detail, we need to examine those arguments on their own terms. For this devotional, keep the central connection clear: I believe God made the land animals and humanity, and I want to understand that claim faithfully."],"status":"Open question","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Identifying Behemoth or Leviathan with a particular dinosaur remains uncertain. An imagined picture cannot establish coexistence."},{"id":"slide-35-read-1","title":"The lifespans recorded in Genesis (1 of 2)","body":["We should also examine the way we dismiss ancient people. Genesis records Adam’s lifespan as nine hundred thirty years, Noah’s as nine hundred fifty, and Shem’s as six hundred in total. I take these as accounts of real people. Imagine the experience a person could accumulate across centuries. That is a possibility worth considering."],"status":"Interpretation","readings":[{"reference":"Genesis 5:5","url":"https://www.esv.org/Genesis%205%3A5/","translation":"ESV","text":"Thus all the days that Adam lived were 930 years, and he died.","relation":"The ages are recorded in these genealogical passages.","verseReferences":["Genesis 5:5"]},{"reference":"Genesis 9:29","url":"https://www.esv.org/Genesis%209%3A29/","translation":"ESV","text":"All the days of Noah were 950 years, and he died.","relation":"The ages are recorded in these genealogical passages.","verseReferences":["Genesis 9:29"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Ages are textual data; extraordinary IQ, disease mechanisms and universal ancient superiority are not supplied by these verses."},{"id":"slide-35-read-2","title":"The lifespans recorded in Genesis (2 of 2)","body":["Scripture does not give us their IQ scores or a medical mechanism for their longevity. So I am not using these recorded ages to prove that everyone then was more intelligent than everyone now. I am using those ages to challenge our habit of assuming ancient means foolish. And across those long lives, there is still a sobering reality: death comes."],"status":"Interpretation","readings":[{"reference":"Genesis 11:10–11","url":"https://www.esv.org/Genesis%2011%3A10-11/","translation":"ESV","text":"These are the generations of Shem. When Shem was 100 years old, he fathered Arpachshad two years after the flood. And Shem lived after he fathered Arpachshad 500 years and had other sons and daughters.","relation":"The ages are recorded in these genealogical passages.","verseReferences":["Genesis 11:10","Genesis 11:11"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Ages are textual data; extraordinary IQ, disease mechanisms and universal ancient superiority are not supplied by these verses."},{"id":"slide-36-read-1","title":"Older does not mean foolish (1 of 2)","body":["We have remarkable tools and accumulated knowledge. That does not make us automatically wiser about God. We should not assume an older belief is false simply because it is old, or that a new idea is true simply because it sounds modern. The reverse error is possible too. A claim does not become true because it has a long tradition behind it."],"status":"Application","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Chronological snobbery is a reasoning caution. A belief’s age alone establishes neither its truth nor its falsehood."},{"id":"slide-36-read-2","title":"Older does not mean foolish (2 of 2)","body":["I want us to examine the reasons. When we read Genesis, let us avoid treating its people as fools merely because they lived long ago. Our phones may be newer. That does not mean our instincts about the Creator are beyond correction. Humility belongs to serious inquiry, including Christian inquiry."],"status":"Application","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Chronological snobbery is a reasoning caution. A belief’s age alone establishes neither its truth nor its falsehood."},{"id":"slide-38-read-1","title":"Common ancestry is a branching claim","body":["That familiar picture of an ape gradually standing upright can give the wrong impression. The scientific claim is not that humans descended from the chimpanzees alive today. It is that humans and other living apes share ancestors. That is why a branching diagram is more accurate than a parade ending with a modern person.","The broader common-ancestry
