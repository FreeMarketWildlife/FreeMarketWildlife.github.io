claim extends across living things beyond the human-and-ape comparison. I reject universal common ancestry, but I do not help my argument by attacking a position scientists are not actually asserting. Understanding the claim fairly gives us a better starting point for asking where the evidence and the interpretation lead."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This fairly describes the scientific ancestry claim before disagreeing with it; a branching model is not a parade from living chimpanzee to human."},{"id":"slide-39-read-1","title":"Two proposed histories of death","body":["The central comparison is when animal death enters the account, not an age number for the planet. Frank Turek and I agree on much and disagree here.","Christians who allow prior animal death may interpret it within providence; I argue that the food provision, completed very-good assessment and Fall/redemption story point another way. That comparison identifies our interpretive disagreement; it does not establish either position merely by describing a possible history."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This compares two interpretations. Describing a proposed history does not prove it; the disputed question is animal death before completed creation."},{"id":"slide-40-read-1","title":"The last enemy (1 of 2)","body":["First Corinthians 15 calls death an enemy. Paul places its defeat within the victory of the risen Christ and the resurrection of His people. This is not a small detail attached to an origins discussion. It is Christian hope. Death does not get the final word over those who belong to Jesus."],"status":"Interpretation","readings":[{"reference":"1 Corinthians 15:26","url":"https://www.esv.org/1%20Corinthians%2015%3A26/","translation":"ESV","text":"The last enemy to be destroyed is death.","relation":"Paul explicitly identifies death as the last enemy to be destroyed in Christ’s resurrection victory.","verseReferences":["1 Corinthians 15:26"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Its place in the promised victory is explicit; a detailed pre-Fall animal chronology is an additional inference."},{"id":"slide-40-read-2","title":"The last enemy (2 of 2)","body":["That is one reason the place of death in the original creation concerns me. I see a movement in Scripture in which Christ overcomes what destroys and corrupts. I want to understand the beginning in the light of that promised victory. And I want our discussion to lead toward worship of the risen Savior rather than ending with a clever argument about the past."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Its place in the promised victory is explicit; a detailed pre-Fall animal chronology is an additional inference."},{"id":"slide-41-read-1","title":"The Bible’s connected story","body":["Creation. Rebellion. Curse. Redemption. Resurrection. Restoration. These are connected movements in the biblical story. God creates. People rebel. Judgment and curse follow. God acts to redeem through Christ. Christ rises, and His people will rise. The promised end includes the removal of death and the curse. I believe this pattern helps us examine the place of suffering and death in the beginning.","It also keeps us from treating Genesis as disposable background. The beginning matters because the same Creator is working toward the promised end. But keep the gospel at the center: the story reaches us as people who need rescue, not merely as observers who need an interesting explanation."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This summarizes a whole-Bible storyline. The summary is a synthesis, not a single verse or a substitute for reading the passages in context."},{"id":"slide-42-read-1","title":"Good through suffering (1 of 2)","body":["I need to make an important distinction here. I am not saying God can never permit suffering for a good purpose. Look at the cross. The people who crucified Jesus acted wickedly, and yet their wickedness did not defeat God’s saving purpose. God brings good through suffering. Christians also know that trials can produce endurance."],"status":"Interpretation","readings":[{"reference":"Acts 2:23","url":"https://www.esv.org/Acts%202%3A23/","translation":"ESV","text":"this Jesus, delivered up according to the definite plan and foreknowledge of God, you crucified and killed by the hands of lawless men.","relation":"Acts names both God’s plan and human lawlessness in the crucifixion. James describes steadfastness through trials.","verseReferences":["Acts 2:23"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"These passages concern God’s good purposes amid suffering. Neither directly describes Eden’s animal biology."},{"id":"slide-42-read-2","title":"Good through suffering (2 of 2)","body":["My question concerns the original creation before the rebellion described in Genesis. We must not confuse God redeeming suffering in a fallen world with a claim that suffering itself is the original good or final goal. Keep that distinction clear so we do not make my creation argument say something much broader and less careful than I intend."],"status":"Interpretation","readings":[{"reference":"James 1:2–4","url":"https://www.esv.org/James%201%3A2-4/","translation":"ESV","text":"Count it all joy, my brothers, when you meet trials of various kinds, for you know that the testing of your faith produces steadfastness. And let steadfastness have its full effect, that you may be perfect and complete, lacking in nothing.","relation":"Acts names both God’s plan and human lawlessness in the crucifixion. James describes steadfastness through trials.","verseReferences":["James 1:2","James 1:3","James 1:4"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"These passages concern God’s good purposes amid suffering. Neither directly describes Eden’s animal biology."},{"id":"slide-43-read-1","title":"Kinds and childhood recognition","body":["When Elijah was about one and a half, he recognized dogs and cats in a picture book across quite different breeds. That familiar experience helps me think about recognizable categories.","It does not tell us exactly which modern taxonomic rank Genesis means by kinds. A car and a bicycle sharing wheels can illustrate my common-designer intuition, but the analogy by itself does not disprove common ancestry."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Elijah’s recognition is Phil’s family illustration, not a biological definition of biblical “kind.” Common design analogies do not by themselves refute ancestry."},{"id":"slide-44-read-1","title":"Selection stories need clear labels","body":["Imagine a zebra with an unusual stripe colour. Whether that variation helps it survive and reproduce depends on its environment and other factors. This is a hypothetical teaching example, not a report of a zebra population we observed.","I do not mean that all mutations are harmful or that every gene belongs in a simple strong-versus-weak hierarchy. The example helps us ask what selection does; it does not settle the origin of life."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":["https://evolution.berkeley.edu/teach-evolution/misconceptions-about-evolution/"],"layout":"reader","claimNote":"The zebra story is hypothetical, not an observed case. Fitness concerns an organism’s environment and reproduction; mutations are not all harmful."},{"id":"slide-45-read-1","title":"If one year were one second…","body":["Suppose every year were represented by one second. How long would a thousand years take? About 16.7 minutes. A million would take about 11.6 days, and a billion about 31.7 years. The change of scale makes these intervals easier to picture.","It does not tell us which chronology is true, and a number does not become impossible simply because it surprises us. We still need evidence and a clear account of the process under discussion."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This is arithmetic for imagining time spans, not evidence deciding a chronology."},{"id":"slide-46-read-1","title":"Rapid change can be real","body":["The 1980 Mount St Helens eruption and the landscape changes that followed provide documented examples of rapid local processes. That matters when we ask how quickly a particular feature could form. But material, scale and physical mechanism matter too.","This local example cannot by itself date every rock, demonstrate a worldwide Flood correlation or invalidate isotope dating. I want the illustration to show what the observation supports, without asking it to prove much more."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":["https://www.usgs.gov/publications/rates-and-processes-channel-development-and-recovery-following-1980-eruption-mount-st"],"layout":"reader","claimNote":"Documented local rapid erosion/deposition does not alone establish a global Flood correlation or invalidate all isotope dating."},{"id":"slide-47-read-1","title":"Different clocks answer different questions","body":["Radiocarbon is one radiometric method, used for relatively recent once-living material. Other isotope systems address much older material. A criticism needs to identify the sample, method and relevant assumptions.","Contamination, reservoir effects and initial conditions are real questions to investigate. They are not a reason to pretend that carbon 14 measures dinosaur-age rocks as billions of years old, or that one anomalous result refutes every dating method."],"status":"Open question","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":["https://www.nist.gov/how-do-you-measure-it/how-do-you-know-age-fossils-and-other-old-things"],"layout":"reader","claimNote":"Different isotope clocks and materials have different ranges and limitations. An anomalous sample requires investigation, not a universal conclusion."},{"id":"slide-48-read-1","title":"Cosmology questions remain questions","body":["The history of the universe is a different question from biological change or the first origin of life. I still have questions about distant starlight and the relation of scientific models to my reading of Genesis. Those questions require their own evidence.","I should not turn them into the unsupported claims that the Big Bang is no longer science or that nobody has observed a stellar explosion. Scientific observation and historical inference both have a role in testing models."],"status":"Open question","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":["https://science.nasa.gov/universe/"],"layout":"reader","claimNote":"Cosmology, abiogenesis and biological evolution answer different questions. Scripture does not directly state a modern cosmological model or a numerical Earth age."},{"id":"slide-49-read-1","title":"The waters above","body":["As I read the waters and expanse passages, I have considered clouds, a canopy and other physical pictures. Genesis gives us the distinction between waters and expanse, but it does not give an oxygen concentration, pressure value or canopy-collapse mechanism.","A cloud-water illustration cannot supply those missing details. Genesis 2:5–6 also does not explicitly say that rain fell nowhere on Earth until Noah. I want to keep the text and my proposed physical model distinct."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The account describes waters and an expanse, but does not specify oxygen, pressure or a vapor/ice canopy. Genesis 2:5–6 does not explicitly say no rain fell anywhere until Noah."},{"id":"slide-50-read-1","title":"A fruit tree and a living seed","body":["I love the picture of provision and reproduction in fruit and seed. A tree can feed a creature while continuing to live and bear fruit, and some animals disperse seeds after eating. These relationships vary by species.","I am not claiming that every seed survives, that manure is built into a seed, or that plant cells never die. Plants are living organisms. My illustration helps us notice the food provision while we examine the separate question about animal suffering."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The fruit-and-seed example illustrates provision. It does not imply plants are not living organisms or that every seed survives every animal."},{"id":"slide-51-read-1","title":"The moon and a witness illustration","body":["The Moon reflects sunlight. That gives me a devotional illustration: we should reflect the light we receive rather than pretend it begins with us. The astronomical fact and the spiritual application are different kinds of claim.","Genesis states the lights’ functions, and Psalm 19 speaks of the heavens declaring God’s glory. The English similarity between sun and Son does not tell us the meaning of a Hebrew word or prove a hidden interpretation."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":["https://science.nasa.gov/moon/moonlight/"],"layout":"reader","claimNote":"Reflected moonlight is a scientific fact; the Christian-witness comparison is devotional application."},{"id":"slide-52-read-1","title":"Skin garments and offerings","body":["Genesis 3:21 describes garments of skins, but it does not explicitly narrate the first sacrifice or first animal death. Genesis 4 describes Cain’s produce offering and Abel’s firstborn of the flock. We should not reverse those details.","Later offerings belong in the wider biblical story, while Hebrews 10 says the blood of animals cannot finally remove sins and directs us to Christ’s effective offering. I can make that biblical connection without inventing an unstated ritual in Genesis."],"status":"Interpretation","readings":[{"reference":"Genesis 3:21","url":"https://www.esv.org/Genesis%203%3A21/","translation":"ESV","text":"And the LORD God made for Adam and for his wife garments of skins and clothed them.","relation":"Genesis describes skin garments, while Hebrews states that bulls’ and goats’ blood cannot take away sins.","verseReferences":["Genesis 3:21"]},{"reference":"Hebrews 10:4","url":"https://www.esv.org/Hebrews%2010%3A4/","translation":"ESV","text":"For it is impossible for the blood of bulls and goats to take away sins.","relation":"Genesis describes skin garments, while Hebrews states that bulls’ and goats’ blood cannot take away sins.","verseReferences":["Hebrews 10:4"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Genesis 3:21 does not narrate the first sacrifice or explicitly identify it as a penal-substitution ceremony. Cain brought produce; Abel brought firstborn of his flock."},{"id":"slide-53-read-1","title":"How old were they?","body":["Genesis records particular ages. Those are different from the explanations we propose for them. Centuries of practice could allow accumulated knowledge, but the text supplies neither IQ scores nor a medical account of longevity.","The reading of Genesis 6:3 as a universal 120 year lifespan cap is disputed, especially alongside subsequent recorded ages. Ham’s and Japheth’s lifespans are not given. Nor do the genealogies directly print a modern calendar date for creation."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The earlier lifespan page quotes the recorded ages. Medical mechanisms and ancient genius remain separate claims needing evidence."},{"id":"slide-54-read-1","title":"Job’s creatures invite humility","body":["Job describes Behemoth and Leviathan without naming a modern species. The term Dinosauria dates to 1842, after the 1611 King James Bible, but that fact does not mean every biblical dragon was a dinosaur.","Dragon artwork and dictionary stories also do not by themselves prove coexistence. The proposed glass-lizard identity for the Eden serpent remains a side theory, not a biblical identification. My gospel argument does not depend on resolving those creature questions."],"status":"Open question","readings":[{"reference":"Job 41:1","url":"https://www.esv.org/Job%2041%3A1/","translation":"ESV","text":"“Can you draw out Leviathan with a fishhook or press down his tongue with a cord?","relation":"Job describes Leviathan using its ancient name.","verseReferences":["Job 41:1"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The verse does not identify a modern species. The later coinage of Dinosauria does not settle what every biblical “dragon” denotes."},{"id":"slide-55-read-1","title":"Eight people and a Chinese character?","body":["First Peter states that eight people were saved through the water in Noah’s time. Some proposed arguments connect that number with a Chinese boat character, but the biblical statement does not establish a Chinese etymology.","That linguistic claim would need specialist evidence. The idea that ancestor worship began with long-lived patriarchs is likewise speculation, and a proposed Flood–Younger Dryas equivalence has not been established here. I am preserving these research questions without teaching them as discoveries."],"status":"Interpretation","readings":[{"reference":"1 Peter 3:20","url":"https://www.esv.org/1%20Peter%203%3A20/","translation":"ESV","text":"because they formerly did not obey, when God’s patience waited in the days of Noah, while the ark was being prepared, in which a few, that is, eight persons, were brought safely through water.","relation":"The text explicitly mentions eight persons saved through water in Noah’s time.","verseReferences":["1 Peter 3:20"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"It does not establish a Chinese-character etymology, ancestor-worship origin or Younger Dryas identification. Those are separate historical proposals."},{"id":"slide-56-read-1","title":"Law, lawgivers and human understanding","body":["My brother Tim is a lawyer. Thinking about the difference between making a law and interpreting one helps me ask philosophical questions about the world’s regularities. Yet a natural law is not the same thing as a civil statute.","Mars-rover precision shows the effectiveness of scientific investigation; it does not prove that all science began with Christians. I can express my wonder at the heavens without attributing an unverified quotation to a famous Christian thinker."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This is a philosophical analogy about discovery and law, not a Scripture proof that scientific practice has exclusively Christian origins."},{"id":"slide-57-read-1","title":"Matt’s example: context matters","body":["My brother Matt asked ChatGPT about a wedding-banquet parable, and I remember being concerned that important context had been omitted. The actual answer is not supplied here, so I cannot reproduce a quotation or judge its exact omissions from memory.","Matthew 22 may be the relevant passage. Its connection with the surrounding religious leaders matters, while interpreting the servants as prophets and the invitations within Israel’s story still requires explanation. We must not turn that into a claim about every Jewish person."],"status":"Open question","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The actual ChatGPT answer and precise question were not supplied. No quotation or screenshot is reconstructed, and the remembered example cannot be fact-checked beyond that boundary."},{"id":"slide-58-read-1","title":"Lewis, Augustine and respect","body":["I admire C. S. Lewis while disagreeing with his treatment of animal suffering in The Problem of Pain. He took suffering seriously and considered speculative prehuman evil; I should represent that fairly. Augustine’s account of non-successive creation also predates Darwin.","He was not claiming that God required millions of years. Chronological snobbery warns against dismissing a belief merely for its age, but age alone cannot establish truth either. Admiration does not relieve us of examining an argument."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This describes historical Christian disagreement; admiration does not decide interpretation. No unverified Lewis or Augustine quotation is used."},{"id":"slide-59-read-1","title":"A conditional either-or challenge","body":["I want to preserve the seriousness of taking God’s Word as true. If Genesis intends six ordinary days, that reading cannot at the same time mean a contrary chronology. But the interpretive premise has to be argued.","The choice is not simply agree with Phil or reject God. Christians can dispute genre and the days while affirming biblical authority and Christ. My challenge is to examine the text honestly, not to turn agreement with me into a salvation requirement."],"status":"Interpretation","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"The either-or conclusion depends on the argued premise that Genesis intends six ordinary days. Disagreeing about that premise is not automatically rejecting God."},{"id":"slide-60-read-1","title":"The cost of Scripture in our language","body":["Tyndale’s translation work and execution in 1536 can challenge how casually we treat Scripture in our own language. That history does not prove a particular creation chronology. We should not claim that the named martyrs died specifically for young-Earth creation.","Imagining an ordinary reader beginning at Genesis is an illustration, not a documented account of what every believer did. The question I want to bring home is: what are we living for, and how seriously do we receive God’s Word?"],"status":"Application","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"Historical devotion to Scripture does not prove a particular creation chronology. These martyrs are not described here as dying specifically for a young Earth."},{"id":"slide-61-read-1","title":"No condemnation and honest confession (1 of 2)","body":["My rough wording that God no longer sees a believer’s wickedness needed qualification. Acceptance in Christ does not mean that God becomes unaware of our sins.","Romans says there is no condemnation for those in Christ; First John still tells us to acknowledge and confess sin. We should not make one of those truths cancel the other. Justification concerns acceptance in Christ, while confession and growth in holiness continue."],"status":"Scripture","readings":[{"reference":"Romans 8:1","url":"https://www.esv.org/Romans%208%3A1/","translation":"ESV","text":"There is therefore now no condemnation for those who are in Christ Jesus.","relation":"The texts explicitly give no condemnation in Christ and ongoing acknowledgement and confession of sin.","verseReferences":["Romans 8:1"]},{"reference":"1 John 1:8–9","url":"https://www.esv.org/1%20John%201%3A8-9/","translation":"ESV","text":"If we say we have no sin, we deceive ourselves, and the truth is not in us. If we confess our sins, he is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.","relation":"The texts explicitly give no condemnation in Christ and ongoing acknowledgement and confession of sin.","verseReferences":["1 John 1:8","1 John 1:9"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"These are related claims about life in Christ. They do not teach that believers have already become sinlessly perfect."},{"id":"slide-61-read-2","title":"Scripture can describe a good man (2 of 2)","body":["Acts calls Barnabas a good man, full of the Holy Spirit and faith. That should stop me from treating every biblical use of good as a claim of absolute sinlessness. Mark 10 directs the rich man toward God’s unique goodness, while Acts describes Barnabas’s character and life.","Neither passage gives me a reason to boast that I have earned salvation. God’s sinless righteousness, genuine human good and created goodness need to be understood in their own contexts."],"status":"Scripture","readings":[{"reference":"Acts 11:24","url":"https://www.esv.org/Acts%2011%3A24/","translation":"ESV","text":"for he was a good man, full of the Holy Spirit and of faith. And a great many people were added to the Lord.","relation":"Luke directly calls Barnabas good and describes him as full of the Holy Spirit and faith. The verse does not call him sinless.","verseReferences":["Acts 11:24"]}],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This corrects an overly broad definition of good. Context determines the particular claim; ordinary human goodness does not purchase reconciliation with God."},{"id":"slide-62-read-1","title":"A conversation, not a loyalty test","body":["I want this to be a conversation that helps us know God. Show the text behind a claim. Allow an honest question. If my interpretation needs correcting, show me why. The purpose is not to sort the room into people loyal to Phil and people who are not.","The Gospel remains central: the Creator is the One against whom we have sinned, and Christ is the One we need. Creation chronology is a serious discussion, but agreement with my chronology is not the condition of belonging to Him."],"status":"Application","readings":[],"visual":"none","appendix":true,"section":"Appendix","sources":[],"layout":"reader","claimNote":"This page explains the devotional’s purpose and invites a fair conversation. It is not a quotation of a Gospel passage or a salvation test tied to chronology."},{"id":"slide-64-read-1","title":"A fair hearing for a different reading (1 of 3)","body":["Cross Examined, “Is Old-Earth Creation Anti-Biblical? Responding to Ken Ham,” Frank Turek. Verified transcript supplied by independent source reviewer: 6:05–6:41 explains his preference for an old universe and Earth while acknowledging that six-day/young-earth reading could be right. At 11:13–11:57 he argues that Romans 5:12 says death spread to mankind and does not itself exclude prior animal death."],"status":"Interpretation","readings":[{"reference":"Romans 5:12","url":"https://www.esv.org/Romans%205%3A12/","translation":"ESV","text":"Therefore, just as sin came into the world through one man, and death through sin, and so death spread to all men because all sinned—","relation":"The sentence explicitly says death spread to all men; it does not itself list animal species.","verseReferences":["Romans 5:12"]}],"sources":["https://www.youtube.com/watch?v=TMmlAZLH0_4&t=365s","https://www.youtube.com/watch?v=TMmlAZLH0_4&t=673s","https://www.youtube.com/watch?v=TMmlAZLH0_4&t=2054s"],"visual":"none","appendix":true,"section":"Appendix · fair disagreement","layout":"reader","claimNote":"Turek’s argument and Phil’s response are interpretations. Applying Romans 14’s food-and-days charity to creation age is an application, not its explicit subject."},{"id":"slide-64-read-2","title":"A fair hearing for a different reading (2 of 3)","body":["Phil can agree about the immediate human focus while arguing his broader inference from Genesis, Fall, groaning and restoration. At 34:14–34:58 Turek applies Romans 14 to charity about creation age. Romans 14 explicitly discusses food and days, not the age of Earth; this is an application. None of this proves an old Earth or requires Phil to abandon his six-day conviction."],"status":"Interpretation","readings":[],"sources":["https://www.youtube.com/watch?v=TMmlAZLH0_4&t=365s","https://www.youtube.com/watch?v=TMmlAZLH0_4&t=673s","https://www.youtube.com/watch?v=TMmlAZLH0_4&t=2054s"],"visual":"none","appendix":true,"section":"Appendix · fair disagreement","layout":"reader","claimNote":"Turek’s argument and Phil’s response are interpretations. Applying Romans 14’s food-and-days charity to creation age is an application, not its explicit subject."},{"id":"slide-64-read-3","title":"A fair hearing for a different reading (3 of 3)","body":["Present the best opposing argument before answering it. Creation portion ends about 35:32; unrelated politics are omitted. Phil’s latest response: “Frank Turek and I agree on a lot of things here.” His central disagreement is animal death before the completed sixth day and the meaning of very good, not proving Earth’s age."],"status":"Interpretation","readings":[],"sources":["https://www.youtube.com/watch?v=TMmlAZLH0_4&t=365s","https://www.youtube.com/watch?v=TMmlAZLH0_4&t=673s","https://www.youtube.com/watch?v=TMmlAZLH0_4&t=2054s"],"visual":"none","appendix":true,"section":"Appendix · fair disagreement","layout":"reader","claimNote":"Turek’s argument and Phil’s response are interpretations. Applying Romans 14’s food-and-days charity to creation age is an application, not its explicit subject."},{"id":"slide-65-read-1","title":"“Created” and “made”: test the argument (1 of 2)","body":["At 9:30–10:48 Turek contrasts made in Exodus 20:11 with created in Genesis 1:1, using an English make-your-bed analogy to argue for preparation of something already present. That is a contested lexical and interpretive inference, not an explicit statement of a long gap in the text."],"status":"Interpretation","readings":[{"reference":"Genesis 2:4","url":"https://www.esv.org/Genesis%202%3A4/","translation":"ESV","text":"These are the generations of the heavens and the earth when they were created, in the day that the LORD God made the earth and the heavens.","relation":"This verse uses both “created” and “made” of the heavens and the earth.","verseReferences":["Genesis 2:4"]}],"sources":["https://www.youtube.com/watch?v=TMmlAZLH0_4&t=570s","https://biblehub.com/lexicon/genesis/2-4.htm","https://biblehub.com/lexicon/genesis/1-26.htm","https://biblehub.com/lexicon/genesis/1-27.htm"],"visual":"none","appendix":true,"section":"Appendix · fair disagreement","layout":"reader","claimNote":"The words overlap in context. An English make-your-bed analogy does not establish a mandatory Hebrew distinction or a long interval."},{"id":"slide-65-read-2","title":"“Created” and “made”: test the argument (2 of 2)","body":["Genesis 2:4 uses both bara and asah with heaven and earth, and Genesis 1:26–27 moves from make humanity to created humanity. These contexts prevent an automatic rule that made must mean merely rearranging a previously created world. They do not by themselves settle every question of creation chronology either. Compare the actual contexts and avoid arguing solely from an English analogy."],"status":"Interpretation","readings":[],"sources":["https://www.youtube.com/watch?v=TMmlAZLH0_4&t=570s","https://biblehub.com/lexicon/genesis/2-4.htm","https://biblehub.com/lexicon/genesis/1-26.htm","https://biblehub.com/lexicon/genesis/1-27.htm"],"visual":"none","appendix":true,"section":"Appendix · fair disagreement","layout":"reader","claimNote":"The words overlap in context. An English make-your-bed analogy does not establish a mandatory Hebrew distinction or a long interval."},{"id":"slide-06-read-1","title":"Order and the question of a mind (1 of 2)","body":["Imagine flying over an island and seeing SOS arranged on the beach. You would look for someone. The arrangement carries a meaning that makes you think of a mind. That illustration expresses why order and intelligibility draw my attention toward a Creator. But an illustration does not settle every question about biological mechanisms."],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix · design illustrations","sources":[],"layout":"reader","claimNote":"The SOS example illustrates inference to intention. It does not model biological selection or decide an animal-death chronology."},{"id":"slide-06-read-2","title":"Order and the question of a mind (2 of 2)","body":["Natural selection is not the same process as a tornado blowing through a scrap yard, and a messy house is not a scientific model of a population. I want to keep the intuition without pretending the analogy has done work it has not done. My strongest concern today is theological: what kind of original creation does Scripture describe?"],"status":"Illustration","readings":[],"visual":"none","appendix":true,"section":"Appendix · design illustrations","sources":[],"layout":"reader","claimNote":"The SOS example illustrates inference to intention. It does not model biological selection or decide an animal-death chronology."},{"id":"slide-67-read-1","title":"Two views. One nearby star. (1 of 2)","body":["Start with an intentionally unscaled thumb demonstration: hold up a thumb against a farther background, alternate eyes and notice the apparent change in direction. The thumb does not move; the viewing position changes. Now replace the eyes with Earth’s positions on opposite sides of its orbit, about six months apart. One star’s apparent position is compared with the more distant stellar background."],"visual":"parallax","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"Geometric method: Earth’s opposite viewing positions give a full baseline of about 2 AU. The conventional parallax p uses the half-baseline; the maximum full shift is about 2p."},{"id":"slide-67-read-2","title":"Two views. One nearby star. (2 of 2)","body":["The conventional parallax angle p corresponds to the one-AU radius, not the whole two-AU baseline. The maximum opposite-view shift is about 2 p. Actual measurements account for proper motion and other effects; a classroom triangle is an introduction, not the entire data-reduction process. Never use the Sun as something to look at for this demonstration."],"visual":"parallax","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"Geometric method: Earth’s opposite viewing positions give a full baseline of about 2 AU. The conventional parallax p uses the half-baseline; the maximum full shift is about 2p."},{"id":"slide-68-read-1","title":"Ten feet here. Proxima far away.","body":["Use the primary room-sized demonstration first. Put the students’ eye positions ten feet apart and a Sun marker halfway between, five feet from each. Those two eye positions represent Earth’s opposite orbital positions, a full baseline of 2 AU. If the target represents Proxima Centauri at approximately 4.25 light-years, its scaled distance would be about 254 miles, or 409 km.","A wall or stage prop across the room is therefore not a scale-correct Proxima target. Use the diagram to explain the long narrow triangle. This is a proportional geometry model, not an actual line of sight over Earth’s curved surface. The background reference is farther stars, not the Sun."],"visual":"none","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"Ten-foot scale: Proxima at roughly 4.25 light-years maps to about 254 miles. This is a proportional model, not an actual long-distance sightline."},{"id":"slide-69-read-1","title":"Ten feet here. New York there. (1 of 2)","body":["Now keep the students ten feet apart and change the hypothetical target distance. Coarsegold to Lower Manhattan is roughly 2440 miles by great-circle distance. At the ten-foot baseline representing 2 AU, that distance corresponds to roughly 41 light-years. It does not correspond to Proxima’s actual 4.25 light-years."],"visual":"none","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"The same ten-foot baseline with an imagined New York target represents about 41 light-years, not Proxima’s actual distance."},{"id":"slide-69-read-2","title":"Ten feet here. New York there. (2 of 2)","body":["These are two different example stars at the same model scale: Proxima at 254 model miles, versus a 41 light-year star at New York. Earth curvature prevents a real sightline to New York.","The location is an imaginary scale aid, not a proposed astronomical observation. Exact calculation with 3923.419 km and 3.048 m baseline gives about 40.7081 light-years; round to 41 because no exact venue was specified."],"visual":"none","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"The same ten-foot baseline with an imagined New York target represents about 41 light-years, not Proxima’s actual distance."},{"id":"slide-70-read-1","title":"Optional: put Proxima in New York","body":["This is a different scale from the primary ten-foot demonstration. If Proxima itself is represented at the roughly 2440-mile Coarsegold–New York separation, the student eye positions need to be about 96 feet apart, with the Sun marker midway 48 feet from each.","The more exact scaled baseline is about 29.2 metres or 95.86 feet. Use rounded numbers for the live exercise. Do not combine the 96-foot setup with the 254-mile target of the ten-foot setup. The hypothetical target direction is perpendicular to the observer baseline; curvature still prevents an actual cross-country sightline."],"visual":"none","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"This optional 96-foot baseline uses a different scale to put Proxima at New York. Its midpoint is about 48 feet from each observer."},{"id":"slide-71-read-1","title":"Run the room demonstration (1 of 2)","body":["Presenter sequence: first alternate eyes while holding a thumb against a more distant background. Explain that this is intentionally not at the astronomical scale. Then put two children’s eye positions ten feet apart and mark the Sun halfway between.","Show the triangle and distinguish the two primary examples: Proxima would be 254 model miles away, while a hypothetical target in New York would represent a star about 41 light-years away."],"visual":"none","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"Thumb and tabletop examples deliberately exaggerate the effect. They illustrate the method rather than disputing stellar distances or dating creation."},{"id":"slide-71-read-2","title":"Run the room demonstration (2 of 2)","body":["Use a separate tabletop arrangement of two viewing points, a nearby marker and a farther background line to make the direction change large enough to see; do not label that prop as scale-correct. Save the 96-foot nearest-star-in-New-York layout for an optional larger outdoor exercise.","Never look directly at the Sun. The purpose is to understand parallax and trigonometry, not to prove that distances are wrong or determine the age of Earth. For the Proxima measurement p is about 0.768 arcseconds and the maximum opposite-view shift 2 p is about 1.536 arcseconds."],"visual":"none","appendix":true,"section":"Appendix · demonstration","status":"Illustration","readings":[],"sources":["https://www.esa.int/ESA_Multimedia/Images/2013/06/Measuring_stellar_distances_by_parallax","https://simbad.u-strasbg.fr/simbad/sim-basic?Ident=Proxima+centauri","https://ssd.jpl.nasa.gov/astro_par.html"],"layout":"reader","claimNote":"Thumb and tabletop examples deliberately exaggerate the effect. They illustrate the method rather than disputing stellar distances or dating creation."},{"id":"reader-credits","title":"Scripture, sources and preserved originals","body":["Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. ESV Text Edition: 2025. The ESV text may not be quoted in any publication made available to the public by a Creative Commons license. The ESV may not be translated in whole or in part into any other language. Used by permission. All rights reserved.","ESV appears after the actual quotations. The rest of the slide text is explanation, interpretation, application or a labeled illustration. Original drafts, recovered wording and editorial decisions remain in the private source archive.","The scientific and historical illustrations support only the claims identified beside them. The Gospel and my argument about original animal death are kept distinct from a claim to have proved a numerical age for Earth."],"status":"Application","readings":[],"visual":"none","appendix":true,"section":"Appendix · credits","sources":["https://www.crossway.org/permissions/"],"layout":"reader","claimNote":"The original and prior presentation versions are retained. No private manuscript is included in public website source or assets."}]};let previewIndex=0,previewSlides=[];const previewView=document.querySelector('#reading-page'),previewPicker=document.querySelector('#choose-slide');function previewSetRoute(){const mode=document.querySelector('#reading-mode').value;previewSlides=previewDeck.slides.filter(s=>mode==='all'||mode==='speaking'&&previewDeck.speakingRoute.includes(s.id)||mode==='core'&&!s.appendix);previewIndex=0;previewPicker.replaceChildren();previewSlides.forEach((s,i)=>{const option=document.createElement('option');option.value=i;option.textContent=(i+1)+'. '+s.title;previewPicker.append(option);});previewShow();}function previewShow(){renderSlide(previewView,previewSlides[previewIndex]);previewView.scrollTop=0;previewPicker.value=previewIndex;document.querySelector('#position').textContent=(previewIndex+1)+' / '+previewSlides.length;}function previewMove(change){previewIndex=Math.max(0,Math.min(previewSlides.length-1,previewIndex+change));previewShow();}document.querySelector('#previous').onclick=()=>previewMove(-1);document.querySelector('#next').onclick=()=>previewMove(1);previewPicker.onchange=()=>{previewIndex=Number(previewPicker.value);previewShow();};document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();previewMove(1);}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();previewMove(-1);}else if(e.key==='Home'){previewIndex=0;previewShow();}else if(e.key==='End'){previewIndex=previewSlides.length-1;previewShow();}});document.querySelector('#reading-mode').onchange=previewSetRoute;previewSetRoute();</script></html>
