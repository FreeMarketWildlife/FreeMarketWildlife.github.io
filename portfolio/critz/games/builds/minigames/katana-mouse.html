<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katana Mouse</title><link rel="stylesheet" href="styles/main.css"><style>html,body{height:100%;overflow:auto}body{margin:0;padding:12px;font-family:system-ui}#game{display:flex;min-height:560px;height:calc(100dvh - 24px)}button,input{font:inherit}#touch-controls{display:flex;gap:10px;padding:8px}#touch-controls button{min-width:64px;min-height:44px;touch-action:none}@media(max-width:700px){.minigame-runner{grid-template-columns:1fr}.minigame-leaderboard{display:none}.minigame-katana__layout{grid-template-columns:1fr}.minigame-quest__main{grid-template-columns:1fr}.minigame-quest__side{display:none}.card-game{min-width:0;overflow:auto}}#game:has(+ #touch-controls){height:calc(100dvh - 90px)}</style><main id="game" aria-label="katana-mouse"></main><script type="module">import { MinigameKatanaMouse } from './src/hud/components/MinigameKatanaMouse.js';const game=new MinigameKatanaMouse();game.mount(document.querySelector('#game'));for(const b of document.querySelectorAll('[data-key]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);window.dispatchEvent(new KeyboardEvent('keydown',{code:b.dataset.key,key:b.dataset.key,bubbles:true}));});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>window.dispatchEvent(new KeyboardEvent('keyup',{code:b.dataset.key,key:b.dataset.key,bubbles:true})));}window.addEventListener('pagehide',()=>game.unmount());</script></html>
