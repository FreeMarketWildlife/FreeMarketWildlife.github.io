<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10272f" />
    <meta
      name="description"
      content="Explore Rootport, build a tiny living world, and share it on Critter. A cozy playable ecosystem RPG."
    />
    <title>Critz: Tycoon — Rootport Stories</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="shell">
      <section class="game-unit" aria-label="Critz Tycoon game">
        <div id="viewport">
          <canvas
            id="world"
            width="480"
            height="320"
            aria-label="Top-down game world. Use the D-pad or arrow keys to walk, A to interact."
          ></canvas>
          <aside id="day-clock" class="day-clock" hidden aria-label="World clock"><div class="clock-top"><span data-clock-day>Day 1</span><span data-clock-sky>☀</span></div><div class="clock-middle"><span class="clock-dial"><i></i></span><strong data-clock-time>6:00 am</strong></div><div class="clock-wallet" data-clock-money></div></aside>
          <div id="dialogue" hidden role="group" aria-label="Conversation">
            <div id="speaker"></div>
            <p id="dialogue-text" aria-hidden="true"></p><span id="dialogue-accessible" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
            <button id="dialogue-next" aria-label="Continue dialogue">
              A <span>Continue</span> ▸
            </button>
          </div>
          <div id="fade"></div>
        </div>
      </section>
      <section id="controller" aria-label="Game controls">
        <div class="dpad" aria-label="Movement">
          <button data-dir="up" class="up" aria-label="Move up">▲</button
          ><button data-dir="left" class="left" aria-label="Move left">◀</button
          ><span class="center"></span
          ><button data-dir="right" class="right" aria-label="Move right">
            ▶</button
          ><button data-dir="down" class="down" aria-label="Move down">
            ▼
          </button>
        </div>
        <div class="system-buttons">
          <button id="run" aria-pressed="false">RUN</button
          ><button id="start">START</button>
        </div>
        <div class="action-buttons">
          <button
            id="b-button"
            class="b-button"
            aria-label="B — Back or cancel"
          >
            B</button
          ><button
            id="a-button"
            class="a-button"
            aria-label="A — Interact or confirm"
          >
            A
          </button>
        </div>
      </section>
    </main>
    <div id="overlay" hidden>
      <section
        id="panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="panel-title"
      ></section>
    </div>
    <div id="game-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
