name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore client social tracking state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
              name: 'youtube-history'
            });
            const latest = artifacts.data.artifacts.find(a => !a.expired &&
              a.workflow_run?.head_branch === context.payload.repository.default_branch);
            if (latest) {
              const archive = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner, repo: context.repo.repo,
                artifact_id: latest.id, archive_format: 'zip'
              });
              fs.writeFileSync(process.env.RUNNER_TEMP + '/youtube-history.zip', Buffer.from(archive.data));
            }
      - name: Read saved observations
        run: |
          mkdir -p .youtube-state
          if [ -f "$RUNNER_TEMP/youtube-history.zip" ]; then
            unzip -o "$RUNNER_TEMP/youtube-history.zip" -d .youtube-state
          fi
      - name: Collect client channels and daily video history
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_youtube.py
      - name: Retain rolling observations (not Git history)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-history
          path: assets/data/*.json
          retention-days: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test workspace authentication
        working-directory: services/workspace-auth
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Test collector
        run: python3 -m unittest discover -s tests -v
      - name: Validate static source
        run: |
          node scripts/build_business_catalog.mjs
          git diff --exit-code -- assets/js/business-catalog.js
          node --test tests/test_business_catalog.mjs
          node scripts/build_blog.mjs --check
          node scripts/build_game_hub.mjs --check
          node tests/test_home_routes.mjs
          node tests/test_blog_publishing.mjs
          python3 scripts/check_site.py
          node tests/test_blog.mjs
          node tests/test_planner.mjs
          node tests/test_content_ideas.mjs
          node tests/test_troy_spreadsheets.mjs
          node tests/test_sermons.mjs
          node tests/test_sermon_workshop.mjs
          node tests/test_sermon_presentations.mjs
          node tests/test_tutorials.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html 404.html CNAME .nojekyll _site/
          cp -R assets portfolio tanoshi contact blog build-a-business game privacy tutorials _site/
          if [ -d games ]; then cp -R games _site/; fi
          test ! -e _site/services
          test ! -e _site/philip-aram
          test ! -e _site/troykearns
          test ! -e _site/troy-kearns
          test ! -e _site/kat-kai
          test ! -e _site/account
          test ! -e _site/AGENTS.md
          test ! -e _site/blog.md
          test ! -e _site/content
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unsuccessful social collections
        run: python3 scripts/check_social_collection.py
